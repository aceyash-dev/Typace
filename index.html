<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typace</title>
  <!-- Grandstander from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ----- reset & global ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    ::selection {
      background: #c48b63;
      color: #fff;
    }
    ::-moz-selection {
      background: #c48b63;
      color: #fff;
    }

    :root {
      --bg: #fbf7f0;
      --surface: #ffffff;
      --text: #2d2a24;
      --muted: #6b655a;
      --border: #e5dfd6;
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
      --radius: 16px;
      --accent: #c48b63;
      --accent-hover: #ab7350;
      --modal-overlay: rgba(0,0,0,0.3);
      --font-family: 'Grandstander', cursive, system-ui, sans-serif;
    }
    .dark {
      --bg: #1e1b17;
      --surface: #2b2722;
      --text: #efebe6;
      --muted: #aaa395;
      --border: #3f3a33;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
      --modal-overlay: rgba(0,0,0,0.6);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      padding: 2rem 1.5rem;
      transition: background 0.25s, color 0.25s;
      min-height: 100vh;
    }

    /* ----- scrollbar (almond) ----- */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #f7f2ea;
    }
    ::-webkit-scrollbar-thumb {
      background: #c48b63;
      border-radius: 999px;
      border: 2px solid #f7f2ea;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ab7350;
    }
    .dark ::-webkit-scrollbar-track {
      background: #2b2722;
    }
    .dark ::-webkit-scrollbar-thumb {
      border-color: #2b2722;
    }

    /* ----- main layout ----- */
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }
    .controls input,
    .controls button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 0.5rem 1rem;
      font-family: var(--font-family);
      font-size: 0.95rem;
      outline: none;
      transition: 0.15s;
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .controls input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196, 122, 90, 0.15);
    }
    .controls input {
      min-width: 200px;
    }
    .controls button:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .controls button svg {
      stroke: currentColor;
    }
    .controls button:hover svg {
      stroke: #fff;
    }

    .icon-btn {
      padding: 0.5rem 0.8rem !important;
    }
    .icon-btn svg {
      display: block;
    }

    .sort-badge {
      font-weight: 600;
      margin-left: 0.2rem;
    }

    /* ----- font grid ----- */
    .font-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.2rem;
      margin-top: 1.5rem;
    }
    .font-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem 1rem 1rem;
      box-shadow: var(--shadow);
      transition: transform 0.1s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      cursor: pointer;
    }
    .font-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    .font-card .name {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      padding-bottom: 0.2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.2rem;
    }
    .font-card .meta {
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.8rem;
    }
    .font-card .meta span {
      background: var(--bg);
      padding: 0.1rem 0.6rem;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .font-card .actions {
      margin-top: 0.6rem;
      display: flex;
      gap: 0.4rem;
    }
    .font-card .actions button {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 0.3rem 0.9rem;
      font-size: 0.8rem;
      font-family: var(--font-family);
      cursor: pointer;
      color: var(--text);
      transition: 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      pointer-events: auto;
    }
    .font-card .actions button:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .font-card .actions button svg {
      stroke: currentColor;
    }
    .font-card .actions button:hover svg {
      stroke: #fff;
    }

    .empty {
      text-align: center;
      padding: 3rem 0;
      color: var(--muted);
      font-size: 1.2rem;
      grid-column: 1 / -1;
    }

    .stats {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      text-align: center;
    }

    /* category headers (shown only when sorting by category) */
    .category-header {
      grid-column: 1 / -1;
      margin: 0.75rem 0 0.25rem;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3rem;
    }

    /* ----- modals (overlay) ----- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-overlay);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* centered modal (about) */
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 400px;
      width: 90%;
      padding: 2rem 1.8rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      transform: scale(0.95);
      transition: transform 0.2s;
    }
    .modal-overlay.active .modal {
      transform: scale(1);
    }
    .modal h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .modal p {
      margin: 0.5rem 0;
      color: var(--muted);
      line-height: 1.5;
    }
    .modal a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .modal a:hover {
      text-decoration: underline;
    }
    .modal .close-btn {
      margin-top: 1.2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 40px;
      padding: 0.5rem 1.5rem;
      font-family: var(--font-family);
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .modal .close-btn:hover {
      background: var(--accent-hover);
    }

    /* bottom sheet for sort */
    .bottom-sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      max-width: 500px;
      width: 100%;
      padding: 1.5rem 1.8rem 2rem;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      margin-top: auto;
    }
    .modal-overlay.active .bottom-sheet {
      transform: translateY(0);
    }
    .bottom-sheet .handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      margin: 0 auto 1rem;
    }
    .bottom-sheet h2 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
      text-align: center;
    }
    .sheet-option {
      display: block;
      width: 100%;
      padding: 0.8rem 1rem;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-family);
      font-size: 1rem;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background 0.1s;
    }
    .sheet-option:last-of-type {
      border-bottom: none;
    }
    .sheet-option:hover {
      background: var(--bg);
    }
    .sheet-option .check {
      display: none;
      float: right;
      color: var(--accent);
      font-weight: 700;
    }
    .sheet-option .check.active {
      display: inline;
    }
    .bottom-sheet .cancel-btn {
      margin-top: 1rem;
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 0.6rem;
      font-family: var(--font-family);
      font-size: 1rem;
      color: var(--muted);
      cursor: pointer;
      transition: 0.15s;
    }
    .bottom-sheet .cancel-btn:hover {
      background: var(--bg);
    }

    .modal-overlay.sheet-overlay {
      align-items: flex-end;
    }

    /* ----- Preview Modal (full-screen slide-up) ----- */
    .preview-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      padding: 1.5rem;
      overflow-y: auto;
    }
    .preview-overlay.active {
      transform: translateY(0);
    }
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-shrink: 0;
    }
    .preview-header .back-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-family: var(--font-family);
    }
    .preview-header .back-btn:hover {
      color: var(--accent);
    }
    .preview-header .preview-title {
      font-size: 1.6rem;
      font-weight: 600;
      flex: 1;
      text-align: center;
    }
    .preview-header .preview-download {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 40px;
      padding: 0.4rem 1.2rem;
      font-family: var(--font-family);
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .preview-header .preview-download:hover {
      background: var(--accent-hover);
    }

    .preview-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .preview-text {
      font-size: 2rem;
      line-height: 1.6;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      min-height: 120px;
      word-break: break-word;
    }
    .preview-abc {
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .preview-abc span {
      background: var(--surface);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
    }

    .preview-controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .preview-controls label {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .preview-controls input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      background: transparent;
    }
    .preview-controls input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: var(--border);
      border-radius: 4px;
    }
    .preview-controls input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: -6px;
      cursor: pointer;
    }
    .preview-controls input[type="range"]::-moz-range-track {
      height: 4px;
      background: var(--border);
      border-radius: 4px;
    }
    .preview-controls input[type="range"]::-moz-range-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }
    .preview-controls .range-value {
      min-width: 3rem;
      text-align: right;
      font-weight: 600;
      color: var(--text);
    }

    .weight-options {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .weight-options button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 0.2rem 0.8rem;
      font-family: var(--font-family);
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text);
      transition: 0.1s;
    }
    .weight-options button:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .weight-options button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .preview-textarea {
      width: 100%;
      padding: 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      resize: vertical;
      outline: none;
      transition: border 0.15s;
      min-height: 60px;
    }
    .preview-textarea:focus {
      border-color: var(--accent);
    }

    /* responsive */
    @media (max-width: 600px) {
      header { flex-direction: column; align-items: stretch; }
      .controls input { min-width: unset; width: 100%; }
      .controls { flex-wrap: wrap; }
      .font-grid { grid-template-columns: 1fr; }
      .bottom-sheet { padding: 1.2rem 1.2rem 1.8rem; }
      .preview-header .preview-title { font-size: 1.2rem; }
      .preview-text { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Typace</h1>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by name or category…" />
      <button id="sortBtn" aria-label="Sort fonts">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 6h10" />
          <path d="M7 12h7" />
          <path d="M7 18h4" />
        </svg>
        <span>Sort</span>
        <span class="sort-badge" id="sortLabel">Name</span>
      </button>
      <button id="aboutBtn">About</button>
      <button id="darkToggle" class="icon-btn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>
  </header>

  <div id="fontGrid" class="font-grid"></div>
  <div class="stats" id="countDisplay">0 fonts</div>
</div>

<!-- About Modal -->
<div id="aboutModal" class="modal-overlay">
  <div class="modal">
    <h2>Typace</h2>
    <p>A curated font collection for your next project.</p>
    <p>Search, sort, and download fonts instantly.</p>
    <p style="font-size:0.85rem; margin-top:0.2rem;">
      Find us on the <a href="https://ace-base.indevs.in" target="_blank" rel="noopener noreferrer">web</a>.
    </p>
    <button class="close-btn" id="modalCloseBtn">Close</button>
  </div>
</div>

<!-- Sort Bottom Sheet -->
<div id="sortModal" class="modal-overlay sheet-overlay">
  <div class="bottom-sheet">
    <div class="handle"></div>
    <h2>Sort Fonts</h2>
    <button class="sheet-option" data-sort="name">
      Name (A–Z)
      <span class="check" id="checkName">✓</span>
    </button>
    <button class="sheet-option" data-sort="category">
      Category
      <span class="check" id="checkCategory">✓</span>
    </button>
    <button class="cancel-btn" id="sortCancelBtn">Cancel</button>
  </div>
</div>

<!-- Preview Modal (full-screen slide-up) -->
<div id="previewOverlay" class="preview-overlay">
  <div class="preview-header">
    <button class="back-btn" id="previewBack">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6" />
      </svg>
      Back
    </button>
    <span class="preview-title" id="previewTitle">Font Name</span>
    <button class="preview-download" id="previewDownload">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
      Download
    </button>
  </div>
  <div class="preview-body">
    <div class="preview-text" id="previewText">
      The quick brown fox jumps over the lazy dog.
    </div>
    <div class="preview-abc">
      <span>ABCDEFGHIJKLMNOPQRSTUVWXYZ</span>
      <span>abcdefghijklmnopqrstuvwxyz</span>
      <span>1234567890</span>
    </div>

    <div class="preview-controls">
      <label>
        <span>Size</span>
        <input type="range" id="sizeSlider" min="12" max="96" value="32" />
        <span class="range-value" id="sizeValue">32px</span>
      </label>
      <label>
        <span>Weight</span>
        <div class="weight-options" id="weightOptions">
          <button data-weight="100">100</button>
          <button data-weight="300">300</button>
          <button data-weight="400" class="active">400</button>
          <button data-weight="500">500</button>
          <button data-weight="700">700</button>
          <button data-weight="900">900</button>
        </div>
      </label>
      <label>
        <span>Line Height</span>
        <input type="range" id="lineHeightSlider" min="1" max="3" step="0.1" value="1.6" />
        <span class="range-value" id="lineHeightValue">1.6</span>
      </label>
      <label>
        <span>Letter Spacing</span>
        <input type="range" id="letterSpacingSlider" min="0" max="0.3" step="0.01" value="0" />
        <span class="range-value" id="letterSpacingValue">0</span>
      </label>
      <textarea class="preview-textarea" id="previewInput" placeholder="Type anything…">The quick brown fox jumps over the lazy dog.</textarea>
    </div>
  </div>
</div>

<script>
  (() => {
    'use strict';

    // ----- fuzzy matcher (subsequence) -----
    function fuzzyMatch(text, query) {
      if (!query) return true;
      const t = text.toLowerCase();
      const q = query.toLowerCase();
      let qi = 0;
      for (let i = 0; i < t.length && qi < q.length; i++) {
        if (t[i] === q[qi]) qi++;
      }
      return qi === q.length;
    }

    // ----- DOM refs -----
    const grid = document.getElementById('fontGrid');
    const searchInput = document.getElementById('searchInput');
    const countDisplay = document.getElementById('countDisplay');
    const darkToggle = document.getElementById('darkToggle');
    const aboutBtn = document.getElementById('aboutBtn');
    const aboutModal = document.getElementById('aboutModal');
    const modalClose = document.getElementById('modalCloseBtn');
    const sortBtn = document.getElementById('sortBtn');
    const sortModal = document.getElementById('sortModal');
    const sortCancel = document.getElementById('sortCancelBtn');
    const sortOptions = document.querySelectorAll('#sortModal .sheet-option');
    const sortLabel = document.getElementById('sortLabel');
    const checkName = document.getElementById('checkName');
    const checkCategory = document.getElementById('checkCategory');

    // Preview elements
    const previewOverlay = document.getElementById('previewOverlay');
    const previewBack = document.getElementById('previewBack');
    const previewTitle = document.getElementById('previewTitle');
    const previewDownload = document.getElementById('previewDownload');
    const previewText = document.getElementById('previewText');
    const previewInput = document.getElementById('previewInput');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const lineHeightSlider = document.getElementById('lineHeightSlider');
    const lineHeightValue = document.getElementById('lineHeightValue');
    const letterSpacingSlider = document.getElementById('letterSpacingSlider');
    const letterSpacingValue = document.getElementById('letterSpacingValue');
    const weightOptions = document.getElementById('weightOptions');

    let currentPreviewFont = null;
    let currentWeight = 400;

    // ----- modal controls (about & sort) -----
    function openAbout() { aboutModal.classList.add('active'); }
    function closeAbout() { aboutModal.classList.remove('active'); }
    aboutBtn.addEventListener('click', openAbout);
    modalClose.addEventListener('click', closeAbout);
    aboutModal.addEventListener('click', (e) => {
      if (e.target === aboutModal) closeAbout();
    });

    function openSort() { sortModal.classList.add('active'); }
    function closeSort() { sortModal.classList.remove('active'); }
    sortBtn.addEventListener('click', openSort);
    sortCancel.addEventListener('click', closeSort);
    sortModal.addEventListener('click', (e) => {
      if (e.target === sortModal) closeSort();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeAbout();
        closeSort();
        closePreview();
      }
    });

    // ----- dark mode -----
    let darkMode = localStorage.getItem('typace_dark') === 'true';
    function applyDark(enabled) {
      document.body.classList.toggle('dark', enabled);
      darkToggle.innerHTML = enabled
        ? `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`
        : `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
      localStorage.setItem('typace_dark', String(enabled));
    }
    applyDark(darkMode);
    darkToggle.addEventListener('click', () => {
      darkMode = !darkMode;
      applyDark(darkMode);
    });

    // ----- sorting state -----
    let currentSort = 'name';
    const sortLabels = {
      name: 'Name',
      category: 'Category'
    };

    function updateSortUI() {
      document.querySelectorAll('#sortModal .check').forEach(c => c.classList.remove('active'));
      if (currentSort === 'name') checkName.classList.add('active');
      else if (currentSort === 'category') checkCategory.classList.add('active');
      sortLabel.textContent = sortLabels[currentSort] || 'Sort';
    }

    sortOptions.forEach(btn => {
      btn.addEventListener('click', () => {
        currentSort = btn.dataset.sort;
        updateSortUI();
        closeSort();
        render();
      });
    });

    // ----- state -----
    let allFonts = [];
    let filteredFonts = [];

    // ----- render -----
    function render() {
      const query = searchInput.value.toLowerCase().trim();

      // Fuzzy filter
      let filtered = allFonts.filter(f =>
        fuzzyMatch(f.name, query) ||
        (f.category && fuzzyMatch(f.category, query))
      );

      // Sorting
      if (currentSort === 'name') {
        filtered.sort((a, b) => a.name.localeCompare(b.name));
      } else if (currentSort === 'category') {
        filtered.sort((a, b) => (a.category || '').localeCompare(b.category || '') || a.name.localeCompare(b.name));
      }

      filteredFonts = filtered;
      countDisplay.textContent = `${filtered.length} font${filtered.length !== 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty">😕 No fonts found</div>`;
        return;
      }

      let html = '';
      let lastCategory = '';

      filtered.forEach((f, index) => {
        // Show category header only when sorting by category and category changed
        if (currentSort === 'category' && f.category && f.category !== lastCategory) {
          html += `<div class="category-header">${f.category}</div>`;
          lastCategory = f.category;
        }

        html += `
          <div class="font-card" data-font-index="${index}">
            <div class="name" style="font-family: '${f.name}', sans-serif;">${f.name}</div>
            <div class="meta">
              ${f.category ? `<span>${f.category}</span>` : ''}
            </div>
            <div class="actions">
              <button class="download-btn" data-file="${f.file}">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="7 10 12 15 17 10" />
                  <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                Download
              </button>
            </div>
          </div>
        `;
      });

      grid.innerHTML = html;

      // Attach card click -> open preview (only if not clicking download)
      grid.querySelectorAll('.font-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.download-btn')) return;
          const index = parseInt(card.dataset.fontIndex);
          const font = filteredFonts[index];
          if (font) openPreview(font);
        });
      });

      // Attach download buttons
      grid.querySelectorAll('.download-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const file = btn.dataset.file;
          downloadFile(file);
        });
      });
    }

    // ----- download helper -----
    function downloadFile(file) {
      const a = document.createElement('a');
      a.href = `fonts/${encodeURIComponent(file)}`;
      a.download = file;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // ----- Preview logic -----
    function openPreview(font) {
      currentPreviewFont = font;
      previewTitle.textContent = font.name;
      // Reset controls
      sizeSlider.value = 32;
      sizeValue.textContent = '32px';
      lineHeightSlider.value = 1.6;
      lineHeightValue.textContent = '1.6';
      letterSpacingSlider.value = 0;
      letterSpacingValue.textContent = '0';
      currentWeight = 400;
      weightOptions.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      weightOptions.querySelector('[data-weight="400"]')?.classList.add('active');

      previewInput.value = 'The quick brown fox jumps over the lazy dog.';
      updatePreviewText();

      // Apply font family to preview elements
      const elements = [previewText, previewInput, ...document.querySelectorAll('.preview-abc span')];
      elements.forEach(el => {
        el.style.fontFamily = `'${font.name}', sans-serif`;
      });

      previewOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closePreview() {
      previewOverlay.classList.remove('active');
      document.body.style.overflow = '';
      currentPreviewFont = null;
    }

    function updatePreviewText() {
      const text = previewInput.value || ' ';
      previewText.textContent = text;
      const size = sizeSlider.value + 'px';
      const lineHeight = lineHeightSlider.value;
      const letterSpacing = letterSpacingSlider.value + 'em';
      previewText.style.fontSize = size;
      previewText.style.lineHeight = lineHeight;
      previewText.style.letterSpacing = letterSpacing;
      previewText.style.fontWeight = 'normal';
      previewText.style.fontVariationSettings = `"wght" ${currentWeight}`;
      previewText.style.fontWeight = currentWeight;
    }

    // Preview event listeners
    previewBack.addEventListener('click', closePreview);
    previewDownload.addEventListener('click', () => {
      if (currentPreviewFont) {
        downloadFile(currentPreviewFont.file);
      }
    });

    previewInput.addEventListener('input', updatePreviewText);

    sizeSlider.addEventListener('input', () => {
      sizeValue.textContent = sizeSlider.value + 'px';
      updatePreviewText();
    });
    lineHeightSlider.addEventListener('input', () => {
      lineHeightValue.textContent = lineHeightSlider.value;
      updatePreviewText();
    });
    letterSpacingSlider.addEventListener('input', () => {
      letterSpacingValue.textContent = letterSpacingSlider.value;
      updatePreviewText();
    });

    weightOptions.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        weightOptions.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentWeight = parseInt(btn.dataset.weight);
        updatePreviewText();
      });
    });

    // ----- load fonts & register with FontFace -----
    async function loadFonts() {
      try {
        const res = await fetch('fonts.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allFonts = data;

        const loadPromises = allFonts.map(async (f) => {
          try {
            const face = new FontFace(f.name, `url(fonts/${encodeURIComponent(f.file)})`);
            await face.load();
            document.fonts.add(face);
          } catch (err) {
            console.warn(`Could not load font "${f.name}":`, err);
          }
        });
        await Promise.allSettled(loadPromises);

        updateSortUI();
        render();
      } catch (err) {
        grid.innerHTML = `<div class="empty">❌ Failed to load - ${err.message}</div>`;
        console.error('Typace: error loading fonts.json', err);
      }
    }

    // ----- event listeners -----
    searchInput.addEventListener('input', render);

    // ----- start -----
    loadFonts();
  })();
</script>
</body>
</html>
