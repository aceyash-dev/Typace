<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Typace · Font Library</title>

    <meta
        name="description"
        content="Typace is a curated font library for discovering, previewing, and using typefaces on the web."
    >

    <meta
        name="keywords"
        content="fonts, typography, typefaces, web fonts, font library, font preview, Typace"
    >

    <meta name="author" content="Typace">
    <meta name="application-name" content="Typace">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#f1e9d2">
    <meta name="color-scheme" content="light dark">

    <link
        rel="canonical"
        href="https://typace.ace-base.cc/"
    >

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Typace">
    <meta property="og:title" content="Typace · Font Library">
    <meta
        property="og:description"
        content="Discover, preview, and use beautiful typefaces with Typace."
    >
    <meta property="og:url" content="https://typace.ace-base.cc/">
    <meta
        property="og:image"
    content="https://typace.ace-base.cc/og-image.png"
    >
    <meta property="og:image:alt" content="Typace">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --bg: #f1e9d2;
            --surface: #fffdf9;
            --surface-soft: #f8f3e8;
            --text: #29251f;
            --muted: #756d61;
            --border: #ded5c7;
            --accent: #b87542;
            --accent-dark: #8f552c;
            --accent-soft: rgba(184, 117, 66, .12);

            --shadow:
                0 2px 8px rgba(43, 34, 25, .055),
                0 12px 35px rgba(43, 34, 25, .045);

            --shadow-hover:
                0 5px 12px rgba(43, 34, 25, .07),
                0 18px 45px rgba(43, 34, 25, .08);

            --radius: 24px;

            --ui-font:
                "Grandstander",
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body.dark {
            --bg: #1d1915;
            --surface: #28231e;
            --surface-soft: #302a24;
            --text: #f4eee5;
            --muted: #aaa093;
            --border: #40382f;
            --accent: #d29460;
            --accent-dark: #e2a875;
            --accent-soft: rgba(210, 148, 96, .13);

            --shadow:
                0 2px 8px rgba(0, 0, 0, .22),
                0 14px 40px rgba(0, 0, 0, .16);

            --shadow-hover:
                0 7px 18px rgba(0, 0, 0, .3),
                0 22px 50px rgba(0, 0, 0, .22);
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding:
                calc(.85rem + var(--safe-top))
                max(.75rem, 3vw)
                calc(1rem + var(--safe-bottom));

            overflow-x: hidden;

            background: var(--bg);
            color: var(--text);

            font-family: var(--ui-font);

            transition:
                background .25s ease,
                color .25s ease;

            -webkit-tap-highlight-color: transparent;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            appearance: none;
            -webkit-appearance: none;
            border: 0;
            -webkit-tap-highlight-color: transparent;
        }

        button,
        .font-card,
        .brand,
        .preview-title,
        .preview-name,
        .control-label,
        .control-value,
        .snippet-title {
            user-select: none;
            -webkit-user-select: none;
        }

        ::selection {
            background: transparent;
            color: inherit;
        }

        ::-moz-selection {
            background: transparent;
            color: inherit;
        }

        input::selection,
        textarea::selection,
        code::selection {
            background: var(--accent-soft);
        }

        img {
            max-width: 100%;
        }

        .app {
            width: min(100%, 920px);
            margin-inline: auto;
        }

        /* Header */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            min-height: 58px;
            margin-bottom: 1rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: .65rem;
            min-width: 0;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            flex: 0 0 auto;
            object-fit: cover;
            border-radius: 13px;
            box-shadow: var(--shadow);
            -webkit-user-drag: none;
        }

        .brand-name {
            font-size: clamp(1.35rem, 4vw, 1.7rem);
            font-weight: 700;
            letter-spacing: -.04em;
            line-height: 1;
        }

        .brand-subtitle {
            margin-top: .18rem;
            color: var(--muted);
            font-size: .68rem;
            line-height: 1;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: .45rem;
        }

        .icon-button {
            width: 44px;
            height: 44px;

            display: grid;
            place-items: center;

            border: 1px solid var(--border);
            border-radius: 50%;

            background: var(--surface);
            color: var(--text);

            box-shadow: var(--shadow);
            cursor: pointer;

            transition:
                transform .18s ease,
                background .18s ease,
                color .18s ease,
                border-color .18s ease;
        }

        .icon-button:hover {
            transform: translateY(-2px);
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .icon-button:focus-visible,
        .back-button:focus-visible,
        .download-button:focus-visible,
        .weight-button:focus-visible,
        .snippet-copy:focus-visible,
        .font-card:focus-visible {
            outline: 3px solid var(--accent-soft);
            outline-offset: 3px;
        }

        .icon-button svg {
            width: 19px;
            height: 19px;
        }

        /* Search */

        .sticky-tools {
            position: sticky;
            top: 0;
            z-index: 50;

            padding: .25rem 0 .8rem;

            background:
                linear-gradient(
                    to bottom,
                    var(--bg) 78%,
                    transparent
                );
        }

        .search {
            position: relative;
        }

        .search input {
            width: 100%;
            height: clamp(48px, 7vw, 56px);

            padding: 0 1rem 0 3.1rem;

            border: 1px solid var(--border);
            border-radius: 999px;

            outline: none;

            background: var(--surface);
            color: var(--text);

            font-size: clamp(.9rem, 2.8vw, 1rem);

            box-shadow: var(--shadow);

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .search input::placeholder {
            color: var(--muted);
        }

        .search input:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 4px var(--accent-soft),
                var(--shadow);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;

            display: grid;
            place-items: center;

            color: var(--muted);

            transform: translateY(-50%);
            pointer-events: none;
        }

        .search-icon svg {
            width: 20px;
            height: 20px;
        }

        /* Font grid */

        .font-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: .8rem;
        }

        .font-card {
            min-width: 0;
            min-height: 175px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            padding: clamp(1rem, 3vw, 1.35rem);

            border: 1px solid var(--border);
            border-radius: clamp(20px, 4vw, 30px);

            background: var(--surface);
            box-shadow: var(--shadow);

            overflow: hidden;
            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .font-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
        }

        .font-card:active {
            transform: scale(.992);
        }

        .font-card.loading .font-specimen {
            color: var(--muted);
            opacity: .65;
        }

        .font-name {
            min-width: 0;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: var(--text);

            font-size: clamp(1.05rem, 3.5vw, 1.35rem);
            font-weight: 700;
            letter-spacing: -.025em;
            line-height: 1.15;
        }

        .font-specimen {
            width: 100%;
            min-height: 76px;

            margin-top: .85rem;
            padding: .25rem .1rem .75rem;

            overflow-x: auto;
            overflow-y: hidden;

            white-space: nowrap;

            font-size: clamp(2rem, 7vw, 3.4rem);
            font-weight: 600;
            letter-spacing: -.035em;
            line-height: 1.35;

            text-rendering: optimizeLegibility;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            scrollbar-width: thin;
        }

        .font-specimen::-webkit-scrollbar {
            height: 4px;
        }

        .font-specimen::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 999px;
        }

        .font-card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6rem;

            margin-top: .7rem;
        }

        .font-meta {
            min-width: 0;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: var(--muted);
            font-size: .68rem;
            line-height: 1.2;
        }

        .preview-label {
            display: inline-flex;
            align-items: center;
            gap: .3rem;

            flex: 0 0 auto;

            color: var(--accent);
            font-size: .7rem;
            font-weight: 600;
        }

        .preview-label svg {
            width: 14px;
            height: 14px;
        }

        /* Status */

        .load-status {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 70px;

            color: var(--muted);
            font-size: .75rem;
            text-align: center;
        }

        .spinner {
            width: 18px;
            height: 18px;

            margin-right: .5rem;

            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;

            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .stats {
            padding: .8rem 0 .25rem;

            border-top: 1px solid var(--border);

            color: var(--muted);
            font-size: .68rem;
            text-align: center;
        }

        .empty {
            grid-column: 1 / -1;
            padding: 4rem 1rem;

            color: var(--muted);
            text-align: center;
        }

        .empty-icon {
            display: block;
            margin-bottom: .6rem;
            font-size: 2rem;
        }

        /* Overlay */

        .preview-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;

            background:
                color-mix(
                    in srgb,
                    var(--bg) 96%,
                    transparent
                );

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity .22s ease,
                visibility .22s ease;
        }

        .preview-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .preview-panel {
            width: min(100%, 820px);
            height: 100%;

            margin-inline: auto;

            padding:
                calc(.85rem + var(--safe-top))
                max(.8rem, 3vw)
                calc(1.1rem + var(--safe-bottom));

            overflow-y: auto;

            transform: translateY(25px);

            transition:
                transform .28s cubic-bezier(.2, .8, .2, 1);
        }

        .preview-overlay.active .preview-panel {
            transform: translateY(0);
        }

        .preview-header {
            display: flex;
            align-items: center;
            gap: .6rem;
            margin-bottom: 1rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: .25rem;

            min-height: 42px;
            padding: .3rem .8rem;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: var(--surface);
            color: var(--text);

            font-size: .8rem;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .back-button svg {
            width: 17px;
            height: 17px;
        }

        .preview-title {
            min-width: 0;
            flex: 1;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            text-align: center;

            font-size: clamp(1.1rem, 4vw, 1.45rem);
            font-weight: 700;
        }

        .download-button {
            display: inline-flex;
            align-items: center;
            gap: .3rem;

            min-height: 42px;
            padding: .3rem .9rem;

            border-radius: 999px;

            background: var(--accent);
            color: #fff;

            font-size: .75rem;
            font-weight: 600;

            cursor: pointer;
        }

        .download-button svg {
            width: 16px;
            height: 16px;
        }

        /* Preview */

        .preview-hero {
            padding: clamp(1rem, 4vw, 1.8rem);

            border: 1px solid var(--border);
            border-radius: clamp(22px, 5vw, 34px);

            background: var(--surface);
            box-shadow: var(--shadow);

            overflow: hidden;
        }

        .preview-name {
            margin-bottom: .6rem;
            color: var(--muted);
            font-size: .72rem;
        }

        .preview-display {
            min-height: 190px;

            display: flex;
            align-items: center;

            padding: 1rem .1rem 1.25rem;

            overflow-x: auto;

            white-space: nowrap;

            font-size: clamp(2.4rem, 9vw, 6rem);
            letter-spacing: -.045em;
            line-height: 1.3;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .preview-characters {
            display: grid;
            gap: .7rem;
            margin-top: .8rem;
        }

        .character-line {
            padding: .8rem .9rem 1rem;

            border: 1px solid var(--border);
            border-radius: 16px;

            background: var(--surface-soft);

            overflow-x: auto;
            white-space: nowrap;

            font-size: clamp(1.2rem, 4vw, 1.7rem);
            line-height: 1.4;

            -webkit-font-smoothing: antialiased;
        }

        /* Controls */

        .preview-controls {
            display: grid;
            gap: .7rem;
            margin-top: .8rem;
        }

        .control {
            display: flex;
            align-items: center;
            gap: .8rem;

            min-height: 48px;
            padding: .55rem .8rem;

            border: 1px solid var(--border);
            border-radius: 16px;

            background: var(--surface);
        }

        .control-label {
            flex: 0 0 76px;
            color: var(--muted);
            font-size: .7rem;
        }

        .control input[type="range"] {
            flex: 1;
            min-width: 0;
            accent-color: var(--accent);
        }

        .control-value {
            min-width: 48px;

            color: var(--text);

            font-size: .7rem;
            font-weight: 600;
            text-align: right;
        }

        .weight-options {
            flex: 1;

            display: flex;
            flex-wrap: wrap;
            gap: .3rem;
        }

        .weight-button {
            height: 30px;
            padding: 0 .6rem;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: var(--surface-soft);
            color: var(--text);

            font-size: .68rem;
            cursor: pointer;
        }

        .weight-button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .preview-input {
            width: 100%;
            min-height: 92px;

            margin-top: .8rem;
            padding: .9rem;

            resize: vertical;

            border: 1px solid var(--border);
            border-radius: 18px;

            outline: none;

            background: var(--surface);
            color: var(--text);

            font-size: .95rem;
            line-height: 1.5;
        }

        .preview-input:focus {
            border-color: var(--accent);
        }

        /* CSS snippet */

        .snippet-section {
            margin-top: .8rem;

            border: 1px solid var(--border);
            border-radius: 20px;

            background: var(--surface);
            box-shadow: var(--shadow);

            overflow: hidden;
        }

        .snippet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .7rem;

            padding: .85rem 1rem;

            border-bottom: 1px solid var(--border);
        }

        .snippet-title {
            font-size: .82rem;
            font-weight: 700;
        }

        .snippet-copy {
            height: 32px;
            padding: 0 .7rem;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: var(--surface-soft);
            color: var(--text);

            font-size: .65rem;
            cursor: pointer;
        }

        .snippet-code {
            display: block;

            max-height: 280px;
            padding: 1rem;

            overflow: auto;

            background:
                color-mix(
                    in srgb,
                    var(--surface-soft) 90%,
                    #000 10%
                );

            color: var(--text);

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: .72rem;
            line-height: 1.65;
            white-space: pre;
        }

        /* Responsive */

        @media (min-width: 640px) {
            .font-list {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .font-card {
                min-height: 210px;
            }

            .preview-display {
                min-height: 270px;
            }
        }

        @media (min-width: 900px) {
            body {
                padding-inline: 1.25rem;
            }

            .font-list {
                gap: 1rem;
            }

            .font-card {
                min-height: 225px;
                padding: 1.4rem;
            }
        }

        @media (max-width: 480px) {
            .brand-subtitle {
                display: none;
            }

            .brand-logo {
                width: 38px;
                height: 38px;
                border-radius: 11px;
            }

            .icon-button {
                width: 40px;
                height: 40px;
            }

            .font-card {
                min-height: 170px;
            }

            .font-specimen {
                min-height: 72px;
                font-size: clamp(1.8rem, 9vw, 2.8rem);
            }

            .preview-header {
                gap: .35rem;
            }

            .back-button {
                padding-inline: .65rem;
            }

            .download-button {
                padding-inline: .7rem;
            }

            .download-button span {
                display: none;
            }

            .preview-display {
                min-height: 170px;
                font-size: clamp(2.2rem, 12vw, 4rem);
            }

            .control {
                flex-wrap: wrap;
            }

            .control-label {
                flex-basis: 62px;
            }

            .weight-options {
                flex-basis: calc(100% - 75px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: .001ms !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>

<body>

<main class="app">

    <header class="header">

        <div class="brand">
            <img
                class="brand-logo"
                src="/icon.png"
                alt="Typace"
                width="42"
                height="42"
                draggable="false"
            >

            <div>
                <div class="brand-name">Typace</div>
                <div class="brand-subtitle">Font Library</div>
            </div>
        </div>

        <div class="toolbar">

            <button
                class="icon-button"
                id="aboutButton"
                type="button"
                aria-label="About Typace"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 16v-4"/>
                    <path d="M12 8h.01"/>
                </svg>
            </button>

            <button
                class="icon-button"
                id="themeButton"
                type="button"
                aria-label="Toggle dark mode"
            ></button>

        </div>

    </header>

    <section class="sticky-tools">

        <div class="search">

            <span class="search-icon" aria-hidden="true">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="11" cy="11" r="7"/>
                    <line x1="16.65" y1="16.65" x2="21" y2="21"/>
                </svg>
            </span>

            <input
                id="searchInput"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Search fonts…"
                aria-label="Search fonts"
            >

        </div>

    </section>

    <section
        class="font-list"
        id="fontList"
        aria-live="polite"
    ></section>

    <div
        class="load-status"
        id="loadStatus"
        aria-live="polite"
    ></div>

    <div
        class="stats"
        id="stats"
    >
        0 fonts
    </div>

</main>

<!-- About -->

<div
    class="preview-overlay"
    id="aboutOverlay"
    aria-hidden="true"
>

    <div class="preview-panel">

        <div class="preview-header">

            <button
                class="back-button"
                id="aboutBack"
                type="button"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path d="M15 18l-6-6 6-6"/>
                </svg>

                Back
            </button>

            <div class="preview-title">
                About Typace
            </div>

        </div>

        <section class="preview-hero">

            <div class="preview-name">
                TYPOGRAPHY
            </div>

            <div
                class="preview-display"
                style="font-family:var(--ui-font)"
            >
                Typace

<script>
(() => {
    "use strict";

    /* =========================================================
       CONFIG
    ========================================================= */

    const API_URL = "/api/fonts";

    const CDN_BASE =
        "https://cdn.jsdelivr.net/gh/aceyash-dev/Typace@main/fonts/";

    const BATCH_SIZE = 20;

    const SPECIMEN =
        "The Quick Brown Fox Jumps Over The Lazy Dog";

    const FONT_EXTENSIONS =
        /\.(woff2?|ttf|otf|eot)$/i;

    const FORMAT_MAP = {
        woff2: "woff2",
        woff: "woff",
        ttf: "truetype",
        otf: "opentype",
        eot: "embedded-opentype"
    };

    /* =========================================================
       DOM
    ========================================================= */

    const $ = id =>
        document.getElementById(id);

    const els = {
        fontList: $("fontList"),
        search: $("searchInput"),
        stats: $("stats"),
        status: $("loadStatus"),

        theme: $("themeButton"),
        aboutButton: $("aboutButton"),

        aboutOverlay: $("aboutOverlay"),
        aboutBack: $("aboutBack"),

        previewOverlay: $("previewOverlay"),
        previewBack: $("previewBack"),

        previewTitle: $("previewTitle"),
        previewFontName: $("previewFontName"),
        previewDisplay: $("previewDisplay"),

        lowercase: $("lowercasePreview"),
        uppercase: $("uppercasePreview"),
        numbers: $("numbersPreview"),

        previewInput: $("previewInput"),
        download: $("previewDownload"),

        size: $("sizeSlider"),
        sizeValue: $("sizeValue"),

        lineHeight: $("lineHeightSlider"),
        lineHeightValue: $("lineHeightValue"),

        spacing: $("letterSpacingSlider"),
        spacingValue: $("letterSpacingValue"),

        weights: $("weightOptions"),

        snippet: $("snippetCode"),
        copySnippet: $("copySnippet")
    };

    /* =========================================================
       STATE
    ========================================================= */

    const state = {
        fonts: [],
        filtered: [],
        current: null,
        weight: 400,
        visible: BATCH_SIZE,
        loaded: new Set(),
        loading: new Set(),
        observer: null,
        searchTimer: null,
        dark: false
    };

    /* =========================================================
       STORAGE
    ========================================================= */

    function storageGet(key, fallback) {
        try {
            const value =
                localStorage.getItem(`typace_${key}`);

            return value === null
                ? fallback
                : JSON.parse(value);
        } catch {
            return fallback;
        }
    }

    function storageSet(key, value) {
        try {
            localStorage.setItem(
                `typace_${key}`,
                JSON.stringify(value)
            );
        } catch {}
    }

    /* =========================================================
       HELPERS
    ========================================================= */

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function stripExtension(value) {
        return String(value || "")
            .replace(FONT_EXTENSIONS, "");
    }

    function getExtension(file) {
        const match =
            String(file || "").match(
                FONT_EXTENSIONS
            );

        return match
            ? match[0].slice(1).toLowerCase()
            : "";
    }

    function getFormat(file) {
        const extension =
            getExtension(file);

        return FORMAT_MAP[extension] || extension;
    }

    function getFilename(path) {
        return String(path || "")
            .split("/")
            .pop() || "";
    }

    function fontURL(file) {
        return (
            CDN_BASE +
            String(file)
                .split("/")
                .filter(Boolean)
                .map(encodeURIComponent)
                .join("/")
        );
    }

    function fontFamily(name) {
        return `'${String(name)
            .replace(/\\/g, "")
            .replace(/'/g, "\\'")}', sans-serif`;
    }

    /* =========================================================
       API NORMALIZATION
    =========================================================

       Supported:

       ["Satoshi.woff2"]

       {
         "fonts": ["Satoshi.woff2"]
       }

       {
         "fonts": [
           {
             "name": "Satoshi",
             "file": "Satoshi.woff2",
             "type": "woff2"
           }
         ]
       }

       Also supports:
       format
       extension
       type
       filename
       path
       family

    ========================================================= */

    function normalizeFont(entry) {
        if (typeof entry === "string") {
            const file =
                getFilename(entry.trim());

            if (!file) {
                return null;
            }

            const extension =
                getExtension(file);

            return {
                name: stripExtension(file),
                file,
                type: extension,
                format: getFormat(file),
                weight: 400,
                style: "normal"
            };
        }

        if (!entry || typeof entry !== "object") {
            return null;
        }

        let file =
            entry.file ||
            entry.filename ||
            entry.path ||
            "";

        let name =
            entry.name ||
            entry.fontName ||
            entry.family ||
            "";

        const type =
            String(
                entry.type ||
                entry.format ||
                entry.extension ||
                ""
            )
                .replace(".", "")
                .toLowerCase();

        /*
         * If the API returns only a name and a type:
         *
         * {
         *   name: "Satoshi",
         *   type: "woff2"
         * }
         */

        if (!file && name) {
            const extension =
                type || "woff2";

            file =
                `${name}.${extension}`;
        }

        if (!name && file) {
            name =
                stripExtension(
                    getFilename(file)
                );
        }

        if (!file || !name) {
            return null;
        }

        file =
            getFilename(file);

        name =
            stripExtension(
                getFilename(name)
            );

        const detectedType =
            type || getExtension(file);

        return {
            name,
            file,

            type:
                detectedType,

            format:
                entry.format ||
                FORMAT_MAP[detectedType] ||
                detectedType,

            weight:
                Number(entry.weight) || 400,

            style:
                entry.style || "normal"
        };
    }

    function normalizeFonts(data) {
        const seen = new Set();

        return data
            .map(normalizeFont)
            .filter(Boolean)
            .filter(font => {
                const key =
                    font.file.toLowerCase();

                if (seen.has(key)) {
                    return false;
                }

                seen.add(key);
                return true;
            });
    }

    /* =========================================================
       FONT LOADING
    ========================================================= */

    async function loadFont(font) {
        if (!font?.file) {
            return false;
        }

        if (state.loaded.has(font.file)) {
            return true;
        }

        if (state.loading.has(font.file)) {
            return false;
        }

        state.loading.add(font.file);

        try {
            const face =
                new FontFace(
                    font.name,
                    `url("${fontURL(font.file)}")`,
                    {
                        weight: String(
                            font.weight || 400
                        ),
                        style:
                            font.style || "normal",
                        display: "swap"
                    }
                );

            await face.load();

            document.fonts.add(face);
            state.loaded.add(font.file);

            return true;
        } catch (error) {
            console.warn(
                "Typace: failed to load",
                font.file,
                error
            );

            return false;
        } finally {
            state.loading.delete(
                font.file
            );
        }
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    function matchScore(name, query) {
        const value =
            name.toLowerCase();

        if (!query) return 1000;
        if (value === query) return 100;
        if (value.startsWith(query)) return 90;
        if (value.includes(query)) return 70;

        let position = 0;

        for (
            let i = 0;
            i < value.length &&
            position < query.length;
            i++
        ) {
            if (value[i] === query[position]) {
                position++;
            }
        }

        return position === query.length
            ? 50
            : 0;
    }

    function filterFonts() {
        const query =
            els.search.value
                .trim()
                .toLowerCase();

        if (!query) {
            state.filtered =
                [...state.fonts].sort(
                    sortFonts
                );
        } else {
            state.filtered =
                state.fonts
                    .map(font => ({
                        font,
                        score:
                            matchScore(
                                font.name,
                                query
                            )
                    }))
                    .filter(
                        item =>
                            item.score > 0
                    )
                    .sort(
                        (a, b) =>
                            b.score -
                            a.score
                    )
                    .map(
                        item =>
                            item.font
                    );
        }

        state.visible =
            Math.min(
                BATCH_SIZE,
                state.filtered.length
            );

        render();
    }

    function sortFonts(a, b) {
        return a.name.localeCompare(
            b.name,
            undefined,
            {
                sensitivity: "base"
            }
        );
    }

    /* =========================================================
       CARDS
    ========================================================= */

    function createCard(font, index) {
        const loaded =
            state.loaded.has(font.file);

        const card =
            document.createElement("article");

        card.className =
            `font-card${loaded ? "" : " loading"}`;

        card.dataset.index =
            String(index);

        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute(
            "aria-label",
            `Preview ${font.name}`
        );

        const variant =
            `${font.weight || 400} · ${
                font.style === "italic"
                    ? "Italic"
                    : "Regular"
            }`;

        card.innerHTML = `
            <div class="font-name"
                title="${escapeHTML(font.name)}">
                ${escapeHTML(font.name)}
            </div>

            <div class="font-specimen">
                ${loaded ? SPECIMEN : "Loading…"}
            </div>

            <div class="font-card-bottom">

                <span
                    class="font-meta"
                    title="${escapeHTML(font.file)}"
                >
                    ${escapeHTML(variant)}
                    · ${escapeHTML(font.type || "font")}
                </span>

                <span class="preview-label">
                    Preview

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path d="M5 12h14"/>
                        <path d="m13 6 6 6-6 6"/>
                    </svg>
                </span>

            </div>
        `;

        if (loaded) {
            applyCardFont(card, font);
        }

        const open = () =>
            openPreview(font);

        card.addEventListener(
            "click",
            open
        );

        card.addEventListener(
            "keydown",
            event => {
                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {
                    event.preventDefault();
                    open();
                }
            }
        );

        return card;
    }

    function applyCardFont(card, font) {
        const specimen =
            card.querySelector(
                ".font-specimen"
            );

        if (!specimen) return;

        specimen.textContent =
            SPECIMEN;

        specimen.style.fontFamily =
            fontFamily(font.name);

        specimen.style.fontWeight =
            String(font.weight || 400);

        specimen.style.fontStyle =
            font.style || "normal";

        card.classList.remove(
            "loading"
        );
    }

    /* =========================================================
       RENDER
    ========================================================= */

    function render() {
        if (state.observer) {
            state.observer.disconnect();
        }

        const fragment =
            document.createDocumentFragment();

        if (!state.filtered.length) {
            const empty =
                document.createElement("div");

            empty.className = "empty";

            empty.innerHTML = `
                <span class="empty-icon">𝘼</span>
                No fonts found.
            `;

            fragment.appendChild(empty);
        } else {
            state.filtered
                .slice(0, state.visible)
                .forEach((font, index) => {
                    fragment.appendChild(
                        createCard(
                            font,
                            index
                        )
                    );
                });
        }

        els.fontList.replaceChildren(
            fragment
        );

        updateStats();
        updateStatus();
        observeLastCard();

        if (state.filtered.length) {
            loadVisibleFonts();
        }
    }

    async function loadVisibleFonts() {
        const cards =
            els.fontList.querySelectorAll(
                ".font-card"
            );

        await Promise.allSettled(
            [...cards].map(
                async card => {
                    const index =
                        Number(
                            card.dataset.index
                        );

                    const font =
                        state.filtered[index];

                    if (!font) return;

                    const success =
                        await loadFont(font);

                    if (success) {
                        applyCardFont(
                            card,
                            font
                        );
                    }
                }
            )
        );
    }

    /* =========================================================
       INFINITE LIST
    ========================================================= */

    function observeLastCard() {
        if (
            state.visible >=
            state.filtered.length
        ) {
            return;
        }

        const last =
            els.fontList.lastElementChild;

        if (!last) return;

        state.observer =
            new IntersectionObserver(
                entries => {
                    if (
                        !entries.some(
                            entry =>
                                entry.isIntersecting
                        )
                    ) {
                        return;
                    }

                    state.observer.disconnect();

                    state.visible =
                        Math.min(
                            state.visible +
                                BATCH_SIZE,
                            state.filtered.length
                        );

                    render();
                },
                {
                    rootMargin: "500px 0px"
                }
            );

        state.observer.observe(last);
    }

    function updateStatus() {
        if (
            !state.filtered.length ||
            state.visible >=
                state.filtered.length
        ) {
            els.status.textContent = "";
            return;
        }

        const remaining =
            state.filtered.length -
            state.visible;

        els.status.innerHTML = `
            <span class="spinner"></span>
            Loading next ${Math.min(
                BATCH_SIZE,
                remaining
            )} fonts
        `;
    }

    function updateStats() {
        const count =
            state.filtered.length;

        let text =
            `${count} font${count === 1 ? "" : "s"}`;

        const query =
            els.search.value.trim();

        if (query) {
            text += ` · matching "${query}"`;
        }

        els.stats.textContent = text;
    }

    /* =========================================================
       PREVIEW
    ========================================================= */

    async function openPreview(font) {
        state.current = font;
        state.weight =
            Number(font.weight) || 400;

        els.previewTitle.textContent =
            font.name;

        els.previewFontName.textContent =
            `${font.name} · ${
                font.type || "font"
            }`;

        els.previewDisplay.textContent =
            "Loading…";

        showOverlay(
            els.previewOverlay
        );

        const success =
            await loadFont(font);

        if (state.current !== font) {
            return;
        }

        const family =
            fontFamily(font.name);

        [
            els.previewDisplay,
            els.lowercase,
            els.uppercase,
            els.numbers,
            els.previewInput
        ].forEach(element => {
            element.style.fontFamily =
                family;

            element.style.fontStyle =
                font.style || "normal";
        });

        els.previewDisplay.textContent =
            success
                ? SPECIMEN
                : "Unable to load font.";

        els.lowercase.textContent =
            "abcdefghijklmnopqrstuvwxyz";

        els.uppercase.textContent =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        els.numbers.textContent =
            "0123456789";

        els.previewInput.value =
            SPECIMEN;

        els.size.value = 52;
        els.lineHeight.value = 1.3;
        els.spacing.value = -.03;

        updateWeightButtons();
        updatePreview();
        updateSnippet();
    }

    function closePreview() {
        hideOverlay(
            els.previewOverlay
        );

        state.current = null;
    }

    function updatePreview() {
        if (!state.current) return;

        const text =
            els.previewInput.value || " ";

        const size =
            Number(els.size.value);

        const lineHeight =
            Number(els.lineHeight.value);

        const spacing =
            Number(els.spacing.value);

        els.previewDisplay.textContent =
            text;

        els.previewDisplay.style.fontWeight =
            String(state.weight);

        els.previewDisplay.style.fontSize =
            `${size}px`;

        els.previewDisplay.style.lineHeight =
            String(lineHeight);

        els.previewDisplay.style.letterSpacing =
            `${spacing}em`;

        els.sizeValue.textContent =
            `${size}px`;

        els.lineHeightValue.textContent =
            lineHeight.toFixed(2);

        els.spacingValue.textContent =
            `${spacing.toFixed(2)}em`;
    }

    function updateWeightButtons() {
        els.weights
            .querySelectorAll(
                ".weight-button"
            )
            .forEach(button => {
                button.classList.toggle(
                    "active",
                    Number(
                        button.dataset.weight
                    ) === state.weight
                );
            });
    }

    /* =========================================================
       OVERLAYS
    ========================================================= */

    function showOverlay(overlay) {
        overlay.classList.add("active");
        overlay.setAttribute(
            "aria-hidden",
            "false"
        );

        document.body.style.overflow =
            "hidden";
    }

    function hideOverlay(overlay) {
        overlay.classList.remove("active");
        overlay.setAttribute(
            "aria-hidden",
            "true"
        );

        if (
            !document.querySelector(
                ".preview-overlay.active"
            )
        ) {
            document.body.style.overflow = "";
        }
    }

    /* =========================================================
       ABOUT
    ========================================================= */

    function openAbout() {
        showOverlay(
            els.aboutOverlay
        );
    }

    function closeAbout() {
        hideOverlay(
            els.aboutOverlay
        );
    }

    /* =========================================================
       DOWNLOAD
    ========================================================= */

    function downloadFont(font) {
        if (!font?.file) return;

        /*
         * Cross-origin download attributes are not consistently
         * honored by browsers. Directly opening the jsDelivr
         * resource is therefore more reliable.
         */

        window.open(
            fontURL(font.file),
            "_blank",
            "noopener,noreferrer"
        );
    }

    /* =========================================================
       SNIPPET
    ========================================================= */

    function generateSnippet(font) {
        const family =
            String(font.name)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        const url =
            fontURL(font.file);

        const format =
            font.format ||
            getFormat(font.file) ||
            "woff2";

        const weight =
            Number(font.weight) || 400;

        const style =
            font.style || "normal";

        return `/* ${font.name} */

@font-face {
    font-family: '${family}';
    src: url('${url}') format('${format}');
    font-style: ${style};
    font-weight: ${weight};
    font-display: swap;
}

.my-text {
    font-family: '${family}', sans-serif;
    font-style: ${style};
    font-weight: ${weight};
}`;
    }

    function updateSnippet() {
        els.snippet.textContent =
            state.current
                ? generateSnippet(
                      state.current
                  )
                : "";
    }

    /* =========================================================
       COPY
    ========================================================= */

    async function copySnippet() {
        if (!state.current) return;

        const text =
            generateSnippet(
                state.current
            );

        try {
            await navigator.clipboard.writeText(
                text
            );
        } catch {
            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";

            document.body.appendChild(
                textarea
            );

            textarea.select();

            try {
                document.execCommand(
                    "copy"
                );
            } catch {}

            textarea.remove();
        }

        els.copySnippet.textContent =
            "Copied";

        setTimeout(() => {
            els.copySnippet.textContent =
                "Copy";
        }, 1200);
    }

    /* =========================================================
       THEME
    ========================================================= */

    function themeIcon() {
        return state.dark
            ? `
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2"/>
                    <path d="M12 21v2"/>
                    <path d="M4.22 4.22l1.42 1.42"/>
                    <path d="M18.36 18.36l1.42 1.42"/>
                    <path d="M1 12h2"/>
                    <path d="M21 12h2"/>
                    <path d="M4.22 19.78l1.42-1.42"/>
                    <path d="M18.36 5.64l1.42-1.42"/>
                </svg>
            `
            : `
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path
                        d="M21 12.79A9 9 0 1 1
                           11.21 3
                           7 7 0 0 0
                           21 12.79z"
                    />
                </svg>
            `;
    }

    function applyTheme() {
        document.body.classList.toggle(
            "dark",
            state.dark
        );

        els.theme.innerHTML =
            themeIcon();

        els.theme.setAttribute(
            "aria-label",
            state.dark
                ? "Switch to light mode"
                : "Switch to dark mode"
        );

        storageSet(
            "dark",
            state.dark
        );
    }

    /* =========================================================
       FONT API
    ========================================================= */

    async function fetchFonts() {
        els.status.innerHTML = `
            <span class="spinner"></span>
            Scanning fonts…
        `;

        try {
            const response =
                await fetch(
                    API_URL,
                    {
                        cache: "no-store",
                        headers: {
                            Accept:
                                "application/json"
                        }
                    }
                );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const payload =
                await response.json();

            const data =
                Array.isArray(payload)
                    ? payload
                    : payload?.fonts;

            if (!Array.isArray(data)) {
                throw new Error(
                    "Invalid font API response."
                );
            }

            state.fonts =
                normalizeFonts(data);

            storageSet(
                "fontsData",
                state.fonts
            );

            filterFonts();

        } catch (error) {
            console.error(
                "Typace:",
                error
            );

            const cached =
                storageGet(
                    "fontsData",
                    []
                );

            const fonts =
                Array.isArray(cached)
                    ? normalizeFonts(cached)
                    : [];

            if (fonts.length) {
                state.fonts = fonts;
                filterFonts();

                els.status.textContent =
                    "Using cached font library";

                return;
            }

            els.fontList.innerHTML = `
                <div class="empty">

                    <span class="empty-icon">⚠</span>

                    Unable to scan fonts.

                    <br>

                    <small>
                        ${escapeHTML(
                            error.message
                        )}
                    </small>

                </div>
            `;

            els.status.textContent = "";
        }
    }

    /* =========================================================
       EVENTS
    ========================================================= */

    els.aboutButton.addEventListener(
        "click",
        openAbout
    );

    els.aboutBack.addEventListener(
        "click",
        closeAbout
    );

    els.previewBack.addEventListener(
        "click",
        closePreview
    );

    els.aboutOverlay.addEventListener(
        "click",
        event => {
            if (
                event.target ===
                els.aboutOverlay
            ) {
                closeAbout();
            }
        }
    );

    els.previewOverlay.addEventListener(
        "click",
        event => {
            if (
                event.target ===
                els.previewOverlay
            ) {
                closePreview();
            }
        }
    );

    els.theme.addEventListener(
        "click",
        () => {
            state.dark = !state.dark;
            applyTheme();
        }
    );

    els.previewInput.addEventListener(
        "input",
        updatePreview
    );

    els.size.addEventListener(
        "input",
        updatePreview
    );

    els.lineHeight.addEventListener(
        "input",
        updatePreview
    );

    els.spacing.addEventListener(
        "input",
        updatePreview
    );

    els.download.addEventListener(
        "click",
        () => {
            downloadFont(
                state.current
            );
        }
    );

    els.copySnippet.addEventListener(
        "click",
        copySnippet
    );

    els.weights.addEventListener(
        "click",
        event => {
            const button =
                event.target.closest(
                    ".weight-button"
                );

            if (!button) return;

            state.weight =
                Number(
                    button.dataset.weight
                );

            updateWeightButtons();
            updatePreview();
        }
    );

    els.search.addEventListener(
        "input",
        () => {
            clearTimeout(
                state.searchTimer
            );

            state.searchTimer =
                setTimeout(
                    filterFonts,
                    100
                );
        }
    );

    document.addEventListener(
        "keydown",
        event => {
            if (
                event.key === "Escape"
            ) {
                if (
                    els.previewOverlay.classList.contains(
                        "active"
                    )
                ) {
                    closePreview();
                } else if (
                    els.aboutOverlay.classList.contains(
                        "active"
                    )
                ) {
                    closeAbout();
                }

                return;
            }

            if (
                event.key === "/" &&
                !["INPUT", "TEXTAREA"].includes(
                    document.activeElement?.tagName
                )
            ) {
                event.preventDefault();
                els.search.focus();
                els.search.select();
            }
        }
    );

    /* =========================================================
       INITIALIZE
    ========================================================= */

    state.dark =
        storageGet(
            "dark",
            false
        );

    applyTheme();
    fetchFonts();

    /* =========================================================
       DEBUG
    ========================================================= */

    window.__typace = {
        all: () => [...state.fonts],

        filtered: () =>
            [...state.filtered],

        loaded: () =>
            [...state.loaded],

        reload:
            fetchFonts,

        cdn:
            fontURL,

        current:
            () => state.current
    };

})();
</script>

</body>
</html>
