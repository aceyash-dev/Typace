<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Typace · Font Library</title>

    <meta
        name="description"
        content="Typace is a curated font library for discovering, previewing, and using typefaces on the web."
    />
    <meta
        name="keywords"
        content="fonts, typography, typefaces, web fonts, font library, font preview, Typace"
    />
    <meta name="author" content="Typace" />
    <meta name="application-name" content="Typace" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f1e9d2" />
    <meta name="color-scheme" content="light" />

    <link rel="canonical" href="https://fonts.ace-base.indevs.in/" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Typace" />
    <meta property="og:title" content="Typace · Font Library" />
    <meta
        property="og:description"
        content="Discover, preview, and use beautiful typefaces with Typace."
    />
    <meta property="og:url" content="https://fonts.ace-base.indevs.in/" />
    <meta
        property="og:image"
        content="https://fonts.ace-base.indevs.in/icon.png"
    />
    <meta property="og:image:alt" content="Typace" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Typace · Font Library" />
    <meta
        name="twitter:description"
        content="Discover, preview, and use beautiful typefaces with Typace."
    />
    <meta
        name="twitter:image"
        content="https://fonts.ace-base.indevs.in/icon.png"
    />

    <!-- UI font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            -webkit-appearance: none;
            appearance: none;
        }

        ::selection {
            background: #c48b63;
            color: #fff;
        }

        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {
            --bg: #f1e9d2;
            --surface: #fffdf9;
            --surface-soft: #f8f3e8;

            --text: #29251f;
            --muted: #756d61;
            --border: #ded5c7;

            --accent: #b87542;
            --accent-dark: #8f552c;
            --accent-soft: rgba(184, 117, 66, 0.12);

            --shadow:
                0 2px 8px rgba(43, 34, 25, 0.055),
                0 12px 35px rgba(43, 34, 25, 0.045);

            --shadow-hover:
                0 5px 12px rgba(43, 34, 25, 0.07),
                0 18px 45px rgba(43, 34, 25, 0.08);

            --radius: 24px;
            --small-radius: 14px;

            --ui-font:
                "Grandstander",
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body.dark {
            --bg: #1d1915;
            --surface: #28231e;
            --surface-soft: #302a24;

            --text: #f4eee5;
            --muted: #aaa093;
            --border: #40382f;

            --accent: #d29460;
            --accent-dark: #e2a875;
            --accent-soft: rgba(210, 148, 96, 0.13);

            --shadow:
                0 2px 8px rgba(0, 0, 0, 0.22),
                0 14px 40px rgba(0, 0, 0, 0.16);

            --shadow-hover:
                0 7px 18px rgba(0, 0, 0, 0.3),
                0 22px 50px rgba(0, 0, 0, 0.22);
        }

        /* =========================================================
           BODY / APP
        ========================================================= */

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--ui-font);
            padding:
                calc(0.85rem + var(--safe-top))
                max(0.75rem, 3vw)
                calc(1rem + var(--safe-bottom));

            transition:
                background 0.25s ease,
                color 0.25s ease;

            overflow-x: hidden;
        }

        .app {
            width: min(100%, 920px);
            margin-inline: auto;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            min-height: 58px;
            margin-bottom: 1rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            min-width: 0;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            object-fit: cover;
            flex: 0 0 auto;
            box-shadow: var(--shadow);
        }

        .brand-name {
            font-size: clamp(1.35rem, 4vw, 1.7rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 0.68rem;
            margin-top: 0.18rem;
            line-height: 1;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .icon-button {
            width: 44px;
            height: 44px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--surface);
            color: var(--text);
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition:
                transform 0.18s ease,
                background 0.18s ease,
                color 0.18s ease,
                border-color 0.18s ease;
        }

        .icon-button:hover {
            transform: translateY(-2px);
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .icon-button svg {
            width: 19px;
            height: 19px;
        }

        /* =========================================================
           SEARCH
        ========================================================= */

        .sticky-tools {
            position: sticky;
            top: 0;
            z-index: 50;

            padding:
                0.25rem
                0
                0.8rem;

            background:
                linear-gradient(
                    to bottom,
                    var(--bg) 78%,
                    transparent
                );
        }

        .search {
            position: relative;
        }

        .search input {
            width: 100%;
            height: clamp(48px, 7vw, 56px);

            padding:
                0 1rem
                0 3.1rem;

            border:
                1px solid var(--border);

            border-radius: 999px;

            outline: none;

            background: var(--surface);
            color: var(--text);

            font-family: var(--ui-font);
            font-size: clamp(0.9rem, 2.8vw, 1rem);

            box-shadow: var(--shadow);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search input::placeholder {
            color: var(--muted);
        }

        .search input:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 4px var(--accent-soft),
                var(--shadow);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);

            color: var(--muted);

            display: grid;
            place-items: center;

            pointer-events: none;
        }

        .search-icon svg {
            width: 20px;
            height: 20px;
        }

        /* =========================================================
           CATEGORIES
        ========================================================= */

        .chips {
            display: flex;
            align-items: center;
            gap: 0.45rem;

            overflow-x: auto;
            overscroll-behavior-inline: contain;

            padding:
                0.1rem
                0.05rem
                0.9rem;

            scrollbar-width: none;
        }

        .chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            flex: 0 0 auto;

            height: 36px;

            padding: 0 0.95rem;

            border:
                1px solid var(--border);

            border-radius: 999px;

            background: var(--surface);
            color: var(--text);

            font-family: var(--ui-font);
            font-size: 0.78rem;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.16s ease,
                background 0.16s ease,
                color 0.16s ease,
                border-color 0.16s ease;
        }

        .chip:hover {
            transform: translateY(-1px);
        }

        .chip.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .chip-count {
            opacity: 0.58;
            margin-left: 0.15rem;
            font-size: 0.68rem;
        }

        /* =========================================================
           FONT LIST
        ========================================================= */

        .font-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
        }

        /*
          20 cards are rendered at a time.
          The next batch is inserted when the user approaches
          the bottom of the current list.
        */

        .font-card {
            position: relative;

            min-width: 0;
            min-height: clamp(175px, 24vw, 220px);

            padding:
                clamp(1rem, 3vw, 1.35rem);

            border:
                1px solid var(--border);

            border-radius:
                clamp(20px, 4vw, 30px);

            background: var(--surface);

            box-shadow: var(--shadow);

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            overflow: hidden;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .font-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
        }

        .font-card:active {
            transform: scale(0.992);
        }

        .font-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.8rem;
        }

        .font-name {
            min-width: 0;

            color: var(--text);

            font-family: var(--ui-font);
            font-size: clamp(1.05rem, 3.5vw, 1.35rem);
            font-weight: 700;

            letter-spacing: -0.025em;
            line-height: 1.15;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .font-category {
            flex: 0 0 auto;

            padding: 0.3rem 0.65rem;

            border-radius: 999px;

            background: var(--accent-soft);
            color: var(--accent);

            font-family: var(--ui-font);
            font-size: 0.62rem;
            font-weight: 600;

            white-space: nowrap;
        }

        /*
          Important:
          The specimen gets generous vertical space and controlled
          line-height so descenders such as g, p, q, y and j are never
          visually clipped.
        */

        .font-specimen-wrap {
            min-width: 0;
            margin-top: 0.85rem;
        }

        .font-specimen {
            width: 100%;

            min-height: 76px;
            max-height: 104px;

            overflow-x: auto;
            overflow-y: hidden;

            padding:
                0.25rem
                0.1rem
                0.75rem;

            scrollbar-width: thin;
            scrollbar-color:
                var(--accent)
                transparent;

            white-space: nowrap;

            /*
              Extra bottom space is intentional.
              Humans somehow invented descenders and then made
              containers that cut them off.
            */
            line-height: 1.35;

            font-size: clamp(2rem, 7vw, 3.4rem);
            font-weight: 600;

            letter-spacing: -0.035em;

            text-rendering: optimizeLegibility;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-specimen::-webkit-scrollbar {
            height: 4px;
        }

        .font-specimen::-webkit-scrollbar-track {
            background: transparent;
        }

        .font-specimen::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 999px;
        }

        .font-card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;

            margin-top: 0.7rem;
        }

        .font-meta {
            color: var(--muted);
            font-size: 0.68rem;
            line-height: 1.2;
        }

        .preview-label {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;

            color: var(--accent);

            font-size: 0.7rem;
            font-weight: 600;
        }

        .preview-label svg {
            width: 14px;
            height: 14px;
        }

        /* =========================================================
           LOADING
        ========================================================= */

        .font-card.loading .font-specimen {
            font-family: var(--ui-font);
            color: var(--muted);
            opacity: 0.65;
        }

        .font-card.loading {
            cursor: default;
        }

        .loading-line {
            width: 75%;
            height: 12px;
            border-radius: 999px;
            background: var(--surface-soft);
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.45;
            }

            50% {
                opacity: 1;
            }
        }

        /* =========================================================
           LOAD MORE / STATUS
        ========================================================= */

        .load-status {
            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 70px;

            color: var(--muted);

            font-size: 0.75rem;
            text-align: center;
        }

        .spinner {
            width: 18px;
            height: 18px;

            border:
                2px solid var(--border);

            border-top-color: var(--accent);

            border-radius: 50%;

            animation: spin 0.7s linear infinite;

            margin-right: 0.5rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .stats {
            padding:
                0.8rem
                0
                0.25rem;

            border-top:
                1px solid var(--border);

            color: var(--muted);

            text-align: center;

            font-size: 0.68rem;
        }

        /* =========================================================
           EMPTY / ERROR
        ========================================================= */

        .empty {
            padding: 4rem 1rem;

            text-align: center;

            color: var(--muted);
        }

        .empty-icon {
            display: block;

            font-size: 2rem;

            margin-bottom: 0.6rem;
        }

        /* =========================================================
           PREVIEW OVERLAY
        ========================================================= */

        .preview-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;

            background:
                color-mix(
                    in srgb,
                    var(--bg) 96%,
                    transparent
                );

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.22s ease,
                visibility 0.22s ease;
        }

        .preview-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .preview-panel {
            width: min(100%, 820px);
            height: 100%;

            margin-inline: auto;

            padding:
                calc(0.85rem + var(--safe-top))
                max(0.8rem, 3vw)
                calc(1.1rem + var(--safe-bottom));

            overflow-y: auto;

            transform: translateY(25px);

            transition:
                transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .preview-overlay.active .preview-panel {
            transform: translateY(0);
        }

        .preview-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;

            margin-bottom: 1rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;

            min-height: 42px;

            padding: 0.3rem 0.8rem;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: var(--surface);
            color: var(--text);

            font-family: var(--ui-font);
            font-size: 0.8rem;

            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .back-button svg {
            width: 17px;
            height: 17px;
        }

        .preview-title {
            min-width: 0;
            flex: 1;

            text-align: center;

            font-size: clamp(1.1rem, 4vw, 1.45rem);
            font-weight: 700;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .download-button {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;

            min-height: 42px;

            padding: 0.3rem 0.9rem;

            border: 0;
            border-radius: 999px;

            background: var(--accent);
            color: #fff;

            font-family: var(--ui-font);
            font-size: 0.75rem;
            font-weight: 600;

            cursor: pointer;
        }

        .download-button svg {
            width: 16px;
            height: 16px;
        }

        /* =========================================================
           PREVIEW HERO
        ========================================================= */

        .preview-hero {
            padding:
                clamp(1rem, 4vw, 1.8rem);

            border:
                1px solid var(--border);

            border-radius:
                clamp(22px, 5vw, 34px);

            background: var(--surface);

            box-shadow: var(--shadow);

            overflow: hidden;
        }

        .preview-name {
            color: var(--muted);
            font-size: 0.72rem;
            margin-bottom: 0.6rem;
        }

        .preview-display {
            min-height: 190px;

            display: flex;
            align-items: center;

            padding:
                1rem
                0.1rem
                1.25rem;

            overflow-x: auto;
            overflow-y: hidden;

            /*
              Prevent g/y/p/q/j from being clipped.
            */
            line-height: 1.3;

            font-size: clamp(2.4rem, 9vw, 6rem);
            font-weight: 400;

            letter-spacing: -0.045em;

            white-space: nowrap;

            scrollbar-width: thin;
            scrollbar-color:
                var(--accent)
                transparent;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .preview-display::-webkit-scrollbar {
            height: 5px;
        }

        .preview-display::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 999px;
        }

        .preview-characters {
            display: grid;
            gap: 0.7rem;

            margin-top: 0.8rem;
        }

        .character-line {
            padding:
                0.8rem
                0.9rem
                1rem;

            border:
                1px solid var(--border);

            border-radius: 16px;

            background: var(--surface-soft);

            overflow-x: auto;

            white-space: nowrap;

            font-size: clamp(1.2rem, 4vw, 1.7rem);

            line-height: 1.4;

            -webkit-font-smoothing: antialiased;
        }

        /* =========================================================
           CONTROLS
        ========================================================= */

        .preview-controls {
            display: grid;
            gap: 0.7rem;

            margin-top: 0.8rem;
        }

        .control {
            display: flex;
            align-items: center;
            gap: 0.8rem;

            min-height: 48px;

            padding:
                0.55rem
                0.8rem;

            border:
                1px solid var(--border);

            border-radius: 16px;

            background: var(--surface);
        }

        .control-label {
            flex: 0 0 76px;

            color: var(--muted);

            font-size: 0.7rem;
        }

        .control input[type="range"] {
            flex: 1;
            min-width: 0;
            accent-color: var(--accent);
        }

        .control-value {
            min-width: 42px;

            color: var(--text);

            font-size: 0.7rem;
            font-weight: 600;

            text-align: right;
        }

        .weight-options {
            flex: 1;

            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .weight-button {
            height: 30px;

            padding: 0 0.6rem;

            border:
                1px solid var(--border);

            border-radius: 999px;

            background: var(--surface-soft);
            color: var(--text);

            font-size: 0.68rem;

            cursor: pointer;
        }

        .weight-button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .preview-input {
            width: 100%;

            min-height: 92px;

            margin-top: 0.8rem;

            padding:
                0.9rem;

            resize: vertical;

            border:
                1px solid var(--border);

            border-radius: 18px;

            outline: none;

            background: var(--surface);
            color: var(--text);

            font-family: var(--ui-font);
            font-size: 0.95rem;

            line-height: 1.5;
        }

        .preview-input:focus {
            border-color: var(--accent);
        }

        /* =========================================================
           CSS SNIPPET
        ========================================================= */

        .snippet-section {
            margin-top: 0.8rem;

            border:
                1px solid var(--border);

            border-radius: 20px;

            background: var(--surface);

            overflow: hidden;

            box-shadow: var(--shadow);
        }

        .snippet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 0.7rem;

            padding:
                0.85rem
                1rem;

            border-bottom:
                1px solid var(--border);
        }

        .snippet-title {
            font-size: 0.82rem;
            font-weight: 700;
        }

        .snippet-copy {
            height: 32px;

            padding:
                0
                0.7rem;

            border:
                1px solid var(--border);

            border-radius: 999px;

            background: var(--surface-soft);
            color: var(--text);

            font-family: var(--ui-font);
            font-size: 0.65rem;

            cursor: pointer;
        }

        .snippet-code {
            display: block;

            padding:
                1rem;

            max-height: 280px;

            overflow: auto;

            background:
                color-mix(
                    in srgb,
                    var(--surface-soft) 90%,
                    #000 10%
                );

            color: var(--text);

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 0.72rem;
            line-height: 1.65;

            white-space: pre;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (min-width: 640px) {
            .font-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .font-card {
                min-height: 210px;
            }

            .preview-display {
                min-height: 270px;
            }
        }

        @media (min-width: 900px) {
            body {
                padding-inline: 1.25rem;
            }

            .font-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
            }

            .font-card {

        }

        @media (max-width: 480px) {

        @media (max-width: 350px) {

        @media (prefers-reduced-motion: reduce) {

            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

    <script>
        (() => {
            "use strict";

            /* =====================================================
               CONFIG
            ====================================================== */

            const BATCH_SIZE = 20;

            const SPECIMEN =
                "The Quick Brown Fox Jumps Over The Lazy Dog";

            /* =====================================================
               DOM
            ====================================================== */

            const fontList =
                document.getElementById("fontList");

            const searchInput =
                document.getElementById("searchInput");

            const chipContainer =
                document.getElementById("chipContainer");

            const stats =
                document.getElementById("stats");

            const loadStatus =
                document.getElementById("loadStatus");

            const themeButton =
                document.getElementById("themeButton");

            const aboutButton =
                document.getElementById("aboutButton");

            const aboutOverlay =
                document.getElementById("aboutOverlay");

            const aboutBack =
                document.getElementById("aboutBack");

            const previewOverlay =
                document.getElementById("previewOverlay");

            const previewBack =
                document.getElementById("previewBack");

            const previewTitle =
                document.getElementById("previewTitle");

            const previewFontName =
                document.getElementById("previewFontName");

            const previewDisplay =
                document.getElementById("previewDisplay");

            const lowercasePreview =
                document.getElementById("lowercasePreview");

            const uppercasePreview =
                document.getElementById("uppercasePreview");

            const numbersPreview =
                document.getElementById("numbersPreview");

            const previewInput =
                document.getElementById("previewInput");

            const previewDownload =
                document.getElementById("previewDownload");

            const sizeSlider =
                document.getElementById("sizeSlider");

            const sizeValue =
                document.getElementById("sizeValue");

            const lineHeightSlider =
                document.getElementById("lineHeightSlider");

            const lineHeightValue =
                document.getElementById("lineHeightValue");

            const letterSpacingSlider =
                document.getElementById("letterSpacingSlider");

            const letterSpacingValue =
                document.getElementById(
                    "letterSpacingValue"
                );

            const weightOptions =
                document.getElementById("weightOptions");

            const snippetCode =
                document.getElementById("snippetCode");

            const copySnippet =
                document.getElementById("copySnippet");

            /* =====================================================
               STATE
            ====================================================== */

            let allFonts = [];

            let filteredFonts = [];

            let currentCategory = "All";

            let currentFont = null;

            let currentWeight = 400;

            let visibleCount = BATCH_SIZE;

            let loadingFiles = new Set();

            let loadedFiles = new Set();

            let searchTimer = null;

            let observer = null;

            /* =====================================================
               STORAGE
            ====================================================== */

            function storageGet(key, fallback) {
                try {
                    const value =
                        localStorage.getItem(
                            "typace_" + key
                        );

                    return value
                        ? JSON.parse(value)
                        : fallback;
                } catch {
                    return fallback;
                }
            }

            function storageSet(key, value) {
                try {
                    localStorage.setItem(
                        "typace_" + key,
                        JSON.stringify(value)
                    );
                } catch {
                    /* Storage may be disabled. */
                }
            }

            /* =====================================================
               THEME
            ====================================================== */

            let darkMode =
                storageGet("dark", false);

            function updateThemeIcon() {
                themeButton.innerHTML =
                    darkMode
                        ? `
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <circle
                                    cx="12"
                                    cy="12"
                                    r="5"
                                ></circle>
                                <path d="M12 1v2"></path>
                                <path d="M12 21v2"></path>
                                <path d="M4.22 4.22l1.42 1.42"></path>
                                <path d="M18.36 18.36l1.42 1.42"></path>
                                <path d="M1 12h2"></path>
                                <path d="M21 12h2"></path>
                                <path d="M4.22 19.78l1.42-1.42"></path>
                                <path d="M18.36 5.64l1.42-1.42"></path>
                            </svg>
                        `
                        : `
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    d="M21 12.79A9 9 0 1 1
                                       11.21 3
                                       7 7 0 0 0
                                       21 12.79z"
                                ></path>
                            </svg>
                        `;
            }

            function applyTheme() {
                document.body.classList.toggle(
                    "dark",
                    darkMode
                );

                updateThemeIcon();

                storageSet("dark", darkMode);
            }

            themeButton.addEventListener(
                "click",
                () => {
                    darkMode = !darkMode;
                    applyTheme();
                }
            );

            applyTheme();

            /* =====================================================
               FONT LOADING
            ====================================================== */

            async function loadFont(font) {
                if (!font || !font.file) {
                    return false;
                }

                const file = font.file;

                if (loadedFiles.has(file)) {
                    return true;
                }

                if (loadingFiles.has(file)) {
                    return false;
                }

                loadingFiles.add(file);

                try {
                    const safeName =
                        String(font.name)
                            .replace(/["']/g, "");

                    const face = new FontFace(
                        safeName,
                        `url("fonts/${encodeURIComponent(file)}")`
                    );

                    await face.load();

                    document.fonts.add(face);

                    loadedFiles.add(file);

                    return true;
                } catch (error) {
                    console.warn(
                        "Unable to load font:",
                        font.name,
                        error
                    );

                    return false;
                } finally {
                    loadingFiles.delete(file);
                }
            }

            /* =====================================================
               FONT FAMILY
            ====================================================== */

            function safeFontFamily(name) {
                return `'${String(name)
                    .replace(/\\/g, "")
                    .replace(/'/g, "\\'")}', sans-serif`;
            }

            /* =====================================================
               SEARCH
            ====================================================== */

            function scoreMatch(text, query) {
                if (!query) {
                    return 1000;
                }

                const value =
                    String(text || "").toLowerCase();

                const search =
                    query.toLowerCase();

                if (value === search) {
                    return 100;
                }

                if (value.startsWith(search)) {
                    return 90;
                }

                if (value.includes(search)) {
                    return 70;
                }

                let position = 0;

                for (
                    let i = 0;
                    i < value.length &&
                    position < search.length;
                    i++
                ) {
                    if (
                        value[i] ===
                        search[position]
                    ) {
                        position++;
                    }
                }

                return position === search.length
                    ? 50
                    : 0;
            }

            function filterFonts() {
                const query =
                    searchInput.value
                        .trim()
                        .toLowerCase();

                let result = [...allFonts];

                if (currentCategory !== "All") {
                    result = result.filter(
                        font =>
                            (
                                font.category ||
                                "Uncategorized"
                            ) === currentCategory
                    );
                }

                if (query) {
                    result =
                        result
                            .map(font => {
                                const nameScore =
                                    scoreMatch(
                                        font.name,
                                        query
                                    );

                                const categoryScore =
                                    scoreMatch(
                                        font.category,
                                        query
                                    ) * 0.5;

                                return {
                                    font,
                                    score: Math.max(
                                        nameScore,
                                        categoryScore
                                    )
                                };
                            })
                            .filter(
                                item =>
                                    item.score > 0
                            )
                            .sort(
                                (a, b) =>
                                    b.score -
                                    a.score
                            )
                            .map(
                                item => item.font
                            );
                } else {
                    result.sort((a, b) =>
                        String(a.name).localeCompare(
                            String(b.name)
                        )
                    );
                }

                filteredFonts = result;

                visibleCount = Math.min(
                    BATCH_SIZE,
                    filteredFonts.length
                );

                render();
            }

            /* =====================================================
               CATEGORIES
            ====================================================== */

            function renderCategories() {
                const categories = [
                    "All",
                    ...new Set(
                        allFonts.map(
                            font =>
                                font.category ||
                                "Uncategorized"
                        )
                    )
                ].sort((a, b) => {
                    if (a === "All") return -1;
                    if (b === "All") return 1;
                    return a.localeCompare(b);
                });

                chipContainer.innerHTML =
                    categories
                        .map(category => {
                            const count =
                                category === "All"
                                    ? allFonts.length
                                    : allFonts.filter(
                                          font =>
                                              (
                                                  font.category ||
                                                  "Uncategorized"
                                              ) === category
                                      ).length;

                            return `
                                <button
                                    class="chip ${
                                        category ===
                                        currentCategory
                                            ? "active"
                                            : ""
                                    }"
                                    type="button"
                                    data-category="${escapeHTML(
                                        category
                                    )}"
                                >
                                    ${escapeHTML(
                                        category
                                    )}
                                    <span class="chip-count">
                                        ${count}
                                    </span>
                                </button>
                            `;
                        })
                        .join("");

                chipContainer
                    .querySelectorAll(".chip")
                    .forEach(button => {
                        button.addEventListener(
                            "click",
                            () => {
                                currentCategory =
                                    button.dataset.category;

                                filterFonts();
                            }
                        );
                    });
            }

            /* =====================================================
               HTML ESCAPE
            ====================================================== */

            function escapeHTML(value) {
                return String(value ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            /* =====================================================
               FONT CARD
            ====================================================== */

            function createFontCard(font, index) {
                const loaded =
                    loadedFiles.has(font.file);

                const card =
                    document.createElement("article");

                card.className =
                    "font-card" +
                    (loaded ? "" : " loading");

                card.dataset.index = index;

                const category =
                    font.category ||
                    "Uncategorized";

                card.innerHTML = `
                    <div class="font-card-top">
                        <div
                            class="font-name"
                            title="${escapeHTML(
                                font.name
                            )}"
                        >
                            ${escapeHTML(font.name)}
                        </div>

                        <span class="font-category">
                            ${escapeHTML(category)}
                        </span>
                    </div>

                    <div class="font-specimen-wrap">
                        <div
                            class="font-specimen"
                            data-specimen
                        >
                            ${
                                loaded
                                    ? SPECIMEN
                                    : "Loading…"
                            }
                        </div>
                    </div>

                    <div class="font-card-bottom">
                        <span class="font-meta">
                            Tap card to preview
                        </span>

                        <span class="preview-label">
                            Preview
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    d="M5 12h14"
                                ></path>
                                <path
                                    d="m13 6 6 6-6 6"
                                ></path>
                            </svg>
                        </span>
                    </div>
                `;

                if (loaded) {
                    const specimen =
                        card.querySelector(
                            "[data-specimen]"
                        );

                    specimen.style.fontFamily =
                        safeFontFamily(font.name);
                }

                card.addEventListener(
                    "click",
                    () => openPreview(font)
                );

                return card;
            }

            /* =====================================================
               RENDER
            ====================================================== */

            function render() {
                renderCategories();

                fontList.innerHTML = "";

                if (!filteredFonts.length) {
                    fontList.innerHTML = `
                        <div class="empty">
                            <span class="empty-icon">
                                𝘼
                            </span>
                            No fonts found.
                        </div>
                    `;

                    loadStatus.textContent = "";

                    updateStats();

                    return;
                }

                const visible =
                    filteredFonts.slice(
                        0,
                        visibleCount
                    );

                const fragment =
                    document.createDocumentFragment();

                visible.forEach(
                    (font, index) => {
                        fragment.appendChild(
                            createFontCard(
                                font,
                                index
                            )
                        );
                    }
                );

                fontList.appendChild(fragment);

                updateStats();

                updateLoadStatus();

                observeCards();

                loadVisibleFonts();
            }

            /* =====================================================
               LOAD 20 FONT BATCH
            ====================================================== */

            async function loadVisibleFonts() {
                const cards =
                    fontList.querySelectorAll(
                        ".font-card"
                    );

                const fontsToLoad = [];

                cards.forEach(card => {
                    const index =
                        Number(
                            card.dataset.index
                        );

                    const font =
                        filteredFonts[index];

                    if (
                        font &&
                        !loadedFiles.has(
                            font.file
                        ) &&
                        !loadingFiles.has(
                            font.file
                        )
                    ) {
                        fontsToLoad.push({
                            card,
                            font
                        });
                    }
                });

                /*
                  Load the current visible batch in parallel.
                  This keeps the UI fast while still supporting
                  large font libraries.
                */

                await Promise.allSettled(
                    fontsToLoad.map(
                        async ({ card, font }) => {
                            const success =
                                await loadFont(font);

                            if (!success) {
                                return;
                            }

                            const specimen =
                                card.querySelector(
                                    "[data-specimen]"
                                );

                            if (specimen) {
                                specimen.textContent =
                                    SPECIMEN;

                                specimen.style.fontFamily =
                                    safeFontFamily(
                                        font.name
                                    );
                            }

                            card.classList.remove(
                                "loading"
                            );
                        }
                    )
                );
            }

            /* =====================================================
               INFINITE BATCH OBSERVER
            ====================================================== */

            function observeCards() {
                if (observer) {
                    observer.disconnect();
                }

                const lastCard =
                    fontList.lastElementChild;

                if (
                    !lastCard ||
                    filteredFonts.length <=
                        visibleCount
                ) {
                    return;
                }

                observer =
                    new IntersectionObserver(
                        entries => {
                            entries.forEach(
                                entry => {
                                    if (
                                        !entry.isIntersecting
                                    ) {
                                        return;
                                    }

                                    observer.disconnect();

                                    visibleCount =
                                        Math.min(
                                            visibleCount +
                                                BATCH_SIZE,
                                            filteredFonts.length
                                        );

                                    render();
                                }
                            );
                        },
                        {
                            rootMargin:
                                "500px 0px"
                        }
                    );

                observer.observe(lastCard);
            }

            /* =====================================================
               STATUS
            ====================================================== */

            function updateLoadStatus() {
                if (
                    visibleCount >=
                    filteredFonts.length
                ) {
                    loadStatus.textContent =
                        filteredFonts.length
                            ? "Contribute on GitHub for more."
                            : "";

                    return;
                }

                const remaining =
                    filteredFonts.length -
                    visibleCount;

                loadStatus.innerHTML = `
                    <span class="spinner"></span>
                    Loading next 20 fonts
                    ${
                        remaining < BATCH_SIZE
                            ? `(${remaining} remaining)`
                            : ""
                    }
                `;
            }

            function updateStats() {
                const query =
                    searchInput.value.trim();

                stats.textContent =
                    `${filteredFonts.length} font${
                        filteredFonts.length === 1
                            ? ""
                            : "s"
                    }`;

                if (query) {
                    stats.textContent +=
                        ` · matching "${query}"`;
                }

                if (
                    currentCategory !== "All"
                ) {
                    stats.textContent +=
                        ` · ${currentCategory}`;
                }
            }

            /* =====================================================
               CSS SNIPPET
            ====================================================== */

            function generateSnippet(font) {
                const file =
                    String(font.file || "")
                        .replace(/\\/g, "\\\\")
                        .replace(/"/g, '\\"');

                const name =
                    String(font.name || "Custom Font")
                        .replace(/\\/g, "\\\\")
                        .replace(/'/g, "\\'");

                return `/* ${font.name} */

@font-face {
    font-family: '${name}';
    src: url('/fonts/${file}') format('truetype');
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
}

.my-text {
    font-family: '${name}', sans-serif;
    font-weight: 600;
    line-height: 1.3;
}`;
            }

            function updateSnippet() {
                if (!currentFont) {
                    snippetCode.textContent = "";
                    return;
                }

                snippetCode.textContent =
                    generateSnippet(
                        currentFont
                    );
            }

            /* =====================================================
               PREVIEW
            ====================================================== */

            async function openPreview(font) {
                currentFont = font;

                previewTitle.textContent =
                    font.name;

                previewFontName.textContent =
                    font.name;

                const family =
                    safeFontFamily(font.name);

                /*
                  Make sure the font is actually available
                  before displaying the preview.
                */

                if (
                    !loadedFiles.has(font.file)
                ) {
                    previewDisplay.textContent =
                        "Loading…";

                    await loadFont(font);
                }

                previewDisplay.style.fontFamily =
                    family;

                lowercasePreview.style.fontFamily =
                    family;

                uppercasePreview.style.fontFamily =
                    family;

                numbersPreview.style.fontFamily =
                    family;

                previewInput.style.fontFamily =
                    family;

                previewDisplay.textContent =
                    SPECIMEN;

                lowercasePreview.textContent =
                    "agjpqy gypqj";

                uppercasePreview.textContent =
                    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

                numbersPreview.textContent =
                    "0123456789";

                previewInput.value =
                    SPECIMEN;

                currentWeight = 400;

                sizeSlider.value = 52;
                lineHeightSlider.value = 1.3;
                letterSpacingSlider.value =
                    -0.03;

                weightOptions
                    .querySelectorAll(
                        ".weight-button"
                    )
                    .forEach(button => {
                        button.classList.toggle(
                            "active",
                            Number(
                                button.dataset.weight
                            ) === 400
                        );
                    });

                updatePreview();

                updateSnippet();

                previewOverlay.classList.add(
                    "active"
                );

                previewOverlay.setAttribute(
                    "aria-hidden",
                    "false"
                );

                document.body.style.overflow =
                    "hidden";
            }

            function closePreview() {
                previewOverlay.classList.remove(
                    "active"
                );

                previewOverlay.setAttribute(
                    "aria-hidden",
                    "true"
                );

                document.body.style.overflow =
                    "";

                currentFont = null;
            }

            function updatePreview() {
                const text =
                    previewInput.value ||
                    " ";

                previewDisplay.textContent =
                    text;

                const size =
                    Number(sizeSlider.value);

                const lineHeight =
                    Number(
                        lineHeightSlider.value
                    );

                const spacing =
                    Number(
                        letterSpacingSlider.value
                    );

                previewDisplay.style.fontSize =
                    `${size}px`;

                previewDisplay.style.lineHeight =
                    lineHeight;

                previewDisplay.style.letterSpacing =
                    `${spacing}em`;

                previewDisplay.style.fontWeight =
                    currentWeight;

                sizeValue.textContent =
                    `${size}px`;

                lineHeightValue.textContent =
                    lineHeight.toFixed(2);

                letterSpacingValue.textContent =
                    `${spacing.toFixed(2)}em`;
            }

            /* =====================================================
               PREVIEW EVENTS
            ====================================================== */

            previewBack.addEventListener(
                "click",
                closePreview
            );

            previewOverlay.addEventListener(
                "click",
                event => {
                    if (
                        event.target ===
                        previewOverlay
                    ) {
                        closePreview();
                    }
                }
            );

            previewInput.addEventListener(
                "input",
                updatePreview
            );

            sizeSlider.addEventListener(
                "input",
                updatePreview
            );

            lineHeightSlider.addEventListener(
                "input",
                updatePreview
            );

            letterSpacingSlider.addEventListener(
                "input",
                updatePreview
            );

            weightOptions
                .querySelectorAll(
                    ".weight-button"
                )
                .forEach(button => {
                    button.addEventListener(
                        "click",
                        () => {
                            currentWeight =
                                Number(
                                    button.dataset
                                        .weight
                                );

                            weightOptions
                                .querySelectorAll(
                                    ".weight-button"
                                )
                                .forEach(
                                    item => {
                                        item.classList.toggle(
                                            "active",
                                            item ===
                                                button
                                        );
                                    }
                                );

                            updatePreview();
                        }
                    );
                });

            /* =====================================================
               DOWNLOAD
            ====================================================== */

            function downloadFont(font) {
                if (!font?.file) {
                    return;
                }

                const link =
                    document.createElement("a");

                link.href =
                    `fonts/${encodeURIComponent(
                        font.file
                    )}`;

                link.download =
                    font.file;

                document.body.appendChild(link);

                link.click();

                link.remove();
            }

            previewDownload.addEventListener(
                "click",
                () => {
                    if (currentFont) {
                        downloadFont(
                            currentFont
                        );
                    }
                }
            );

            /* =====================================================
               COPY CSS
            ====================================================== */

            copySnippet.addEventListener(
                "click",
                async () => {
                    if (!currentFont) {
                        return;
                    }

                    const text =
                        generateSnippet(
                            currentFont
                        );

                    try {
                        await navigator.clipboard.writeText(
                            text
                        );

                        copySnippet.textContent =
                            "Copied";

                        setTimeout(() => {
                            copySnippet.textContent =
                                "Copy";
                        }, 1200);
                    } catch {
                        copySnippet.textContent =
                            "Copy failed";

                        setTimeout(() => {
                            copySnippet.textContent =
                                "Copy";
                        }, 1200);
                    }
                }
            );

            /* =====================================================
               ABOUT
            ====================================================== */

            function openAbout() {
                aboutOverlay.classList.add(
                    "active"
                );

                aboutOverlay.setAttribute(
                    "aria-hidden",
                    "false"
                );

                document.body.style.overflow =
                    "hidden";
            }

            function closeAbout() {
                aboutOverlay.classList.remove(
                    "active"
                );

                aboutOverlay.setAttribute(
                    "aria-hidden",
                    "true"
                );

                document.body.style.overflow =
                    "";
            }

            aboutButton.addEventListener(
                "click",
                openAbout
            );

            aboutBack.addEventListener(
                "click",
                closeAbout
            );

            aboutOverlay.addEventListener(
                "click",
                event => {
                    if (
                        event.target ===
                        aboutOverlay
                    ) {
                        closeAbout();
                    }
                }
            );

            /* =====================================================
               SEARCH
            ====================================================== */

            searchInput.addEventListener(
                "input",
                () => {
                    clearTimeout(searchTimer);

                    searchTimer =
                        setTimeout(
                            filterFonts,
                            120
                        );
                }
            );

            /* =====================================================
               KEYBOARD
            ====================================================== */

            document.addEventListener(
                "keydown",
                event => {
                    if (
                        event.key === "Escape"
                    ) {
                        if (
                            previewOverlay.classList.contains(
                                "active"
                            )
                        ) {
                            closePreview();
                        } else if (
                            aboutOverlay.classList.contains(
                                "active"
                            )
                        ) {
                            closeAbout();
                        }

                        return;
                    }

                    if (
                        event.key === "/" &&
                        document.activeElement !==
                            searchInput &&
                        !["INPUT", "TEXTAREA"].includes(
                            document.activeElement
                                ?.tagName
                        )
                    ) {
                        event.preventDefault();

                        searchInput.focus();

                        searchInput.select();
                    }
                }
            );

            /* =====================================================
               LOAD FONTS.JSON
            ====================================================== */

            async function fetchFonts() {
                loadStatus.innerHTML = `
                    <span class="spinner"></span>
                    Loading fonts…
                `;

                try {
                    const response =
                        await fetch(
                            "fonts.json",
                            {
                                cache: "no-cache"
                            }
                        );

                    if (!response.ok) {
                        throw new Error(
                            `HTTP ${response.status}`
                        );
                    }

                    const data =
                        await response.json();

                    if (
                        !Array.isArray(data)
                    ) {
                        throw new Error(
                            "fonts.json must contain an array."
                        );
                    }

                    allFonts = data.filter(
                        font =>
                            font &&
                            font.name &&
                            font.file
                    );

                    storageSet(
                        "fontsData",
                        allFonts
                    );

                    filterFonts();

                } catch (error) {
                    console.error(
                        "Typace:",
                        error
                    );

                    const cached =
                        storageGet(
                            "fontsData",
                            []
                        );

                    if (
                        Array.isArray(cached) &&
                        cached.length
                    ) {
                        allFonts = cached;

                        filterFonts();

                        loadStatus.textContent =
                            "Using cached font library";
                    } else {
                        fontList.innerHTML = `
                            <div class="empty">
                                <span class="empty-icon">
                                    ⚠
                                </span>
                                Failed to load fonts.json.
                                <br />
                                <small>
                                    ${escapeHTML(
                                        error.message
                                    )}
                                </small>
                            </div>
                        `;

                        loadStatus.textContent =
                            "";
                    }
                }
            }

            /* =====================================================
               INITIALIZE
            ====================================================== */

            fetchFonts();

            /*
              Useful debug API.
            */

            window.__typace = {
                all: () => allFonts,
                filtered: () => filteredFonts,
                loaded: () =>
                    [...loadedFiles],
                reload: fetchFonts
            };
        })();
    </script>
</body>
</html>
