<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Typace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ── reset & vars ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        ::selection {
            background: #c48b63;
            color: #fff;
        }

        :root {
            --bg: #fbf7f0;
            --surface: #ffffff;
            --text: #2d2a24;
            --muted: #6b655a;
            --border: #e5dfd6;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --accent: #c48b63;
            --accent-hover: #ab7350;
            --modal-overlay: rgba(0, 0, 0, 0.3);
            --font-family: 'Grandstander', cursive, system-ui, sans-serif;
            --chip-radius: 40px;
            --card-gap: 0.6rem;
          --button-text: #2d2a24;
        }
        .dark {
            --bg: #1e1b17;
            --surface: #2b2722;
            --text: #efebe6;
            --muted: #aaa395;
            --border: #3f3a33;
          --button-text: #efebe6;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-family);
            padding: 1.2rem 1rem 2rem;
            transition: background 0.25s, color 0.25s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── scrollbar ── */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 999px;
            border: 2px solid var(--bg);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }
        .dark ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        .dark ::-webkit-scrollbar-thumb {
            border-color: var(--bg);
        }

        /* ── layout ── */
        .container {
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .top-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
        }
        .top-row .search-wrap {
            flex: 1;
            min-width: 140px;
            position: relative;
        }
        .top-row .search-wrap input {
            width: 100%;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding-left:3rem;
            font-family: var(--font-family);
            height:45px;
    font-size:1.25rem;
            outline: none;
            transition: 0.15s;
            box-shadow: var(--shadow);
        }
        .top-row .search-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(196, 122, 90, 0.15);
        }
        .top-row .search-wrap .search-icon {
            position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
        }
      .search-icon svg{
    width:20px;
    height:20px;
    stroke:currentColor;
    opacity:.75;
      }

        .toolbar{
    display:flex;
    gap:.75rem;
}

.toolbar button{
    width:52px;
    height:52px;
    padding:0;
    border:none;
    border-radius:999px;
  color:var(--button-text);
    background:var(--surface);
    box-shadow:var(--shadow);
    display:grid;
    place-items:center;
    transition:.2s;
}

.toolbar button:hover{
    transform:translateY(-2px);
    background:var(--accent);
    color:#fff;
}

.toolbar button svg{
    width:24px;
    height:24px;
}
        .top-row .toolbar button:hover svg {
            stroke: #fff;
        }
        .icon-btn {
            padding: 0.45rem 0.7rem !important;
        }
        .icon-btn svg {
            display: block;
        }

        /* ── category chips ── */
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 0.6rem 0 1rem;
            flex-shrink: 0;
        }
        .chips button {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--chip-radius);
            height:42px;
    padding:0 1rem;
    font-size:.95rem;
            font-family: var(--font-family);
            color: var(--text);
            cursor: pointer;
            transition: 0.15s;
            box-shadow: var(--shadow);
            white-space: nowrap;
            font-weight: 500;
        }
        .chips button:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .chips button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .chips button .count {
            font-weight: 400;
            opacity: 0.6;
            font-size: 0.75rem;
            margin-left: 0.2rem;
        }
        .chips button.active .count {
            opacity: 0.8;
        }

        /* ── font list ── */
        .font-list {
            display: flex;
            flex-direction: column;
            gap: var(--card-gap);
            flex: 1;
            padding-bottom: 1rem;
        }

        .font-item{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:24px;
    padding:1.25rem;
    min-height:140px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    box-shadow:var(--shadow);
    transition:.18s;
}

.font-item:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
}
        
        .font-item .left {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            flex: 1;
            min-width: 120px;
        }
        .font-item .name {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -0.2px;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom:.35rem;
        }
        .font-item .name .loading-dots {
            color: var(--muted);
            font-weight: 400;
            font-size: 0.8rem;
            margin-left: 0.4rem;
        }
        .font-item .category{
    display:inline-flex;
    align-items:center;
    gap:.3rem;
    padding:.28rem .8rem;
    border-radius:999px;
    background:rgba(196,139,99,.12);
    border:none;
    color:var(--accent);
    font-weight:600;
    font-size:.75rem;
}
        .font-item .actions {
            display: flex;
            gap: 0.3rem;
            flex-shrink: 0;
        }
        .font-item .actions button {
            background:var(--accent);
    color:#fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.25rem 0.8rem;
            flex:1;
    height:50px;
    font-size:1rem;
    font-weight:700;
            font-family: var(--font-family);
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            pointer-events: auto;
        }
        .font-item .actions button:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .font-item .actions button:hover svg {
            stroke: #fff;
        }
        .font-item .actions button svg {
            stroke: currentColor;
        }

        .font-item .preview-tag {
            font-size: 0.65rem;
            color: var(--muted);
            background: var(--bg);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            opacity: 0.7;
        }

        .font-item.loading .name {
            color: var(--muted);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--muted);
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }
        .empty-state .emoji {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .stats {
            margin-top: 0.8rem;
            font-size: 0.8rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 0.8rem;
            text-align: center;
            flex-shrink: 0;
        }

        /* ── modals ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--modal-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 380px;
            width: 90%;
            padding: 1.8rem 1.6rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: scale(0.95);
            transition: transform 0.2s;
        }
        .modal-overlay.active .modal {
            transform: scale(1);
        }
        .modal h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .modal p {
            margin: 0.4rem 0;
            color: var(--muted);
            line-height: 1.5;
        }
        .modal a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .modal a:hover {
            text-decoration: underline;
        }
        .modal .close-btn {
            margin-top: 1rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 0.4rem 1.4rem;
            font-family: var(--font-family);
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        .modal .close-btn:hover {
            background: var(--accent-hover);
        }

        /* ── preview ── */
        .preview-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
            padding: 1.2rem 1rem 1.5rem;
            overflow-y: auto;
        }
        .preview-overlay.active {
            transform: translateY(0);
        }
        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-shrink: 0;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .preview-header .back-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-family: var(--font-family);
            padding: 0.2rem 0.4rem;
        }
        .preview-header .back-btn:hover {
            color: var(--accent);
        }
        .preview-header .preview-title {
            font-size: 1.4rem;
            font-weight: 600;
            flex: 1;
            text-align: center;
            min-width: 80px;
        }
        .preview-header .preview-download {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-family: var(--font-family);
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .preview-header .preview-download:hover {
            background: var(--accent-hover);
        }

        .preview-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .preview-text {
            font-size: 2rem;
            line-height: 1.6;
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--border);
            min-height: 90px;
            word-break: break-word;
        }
        .preview-abc {
            font-size: 1rem;
            letter-spacing: 0.04em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.8rem;
        }
        .preview-abc span {
            background: var(--surface);
            padding: 0.05rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .preview-controls {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 0.2rem;
        }
        .preview-controls label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .preview-controls input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            background: transparent;
            height: 4px;
        }
        .preview-controls input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
        }
        .preview-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: -5px;
            cursor: pointer;
        }
        .preview-controls input[type="range"]::-moz-range-track {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
        }
        .preview-controls input[type="range"]::-moz-range-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
        }
        .preview-controls .range-value {
            min-width: 2.6rem;
            text-align: right;
            font-weight: 600;
            color: var(--text);
            font-size: 0.8rem;
        }

        .weight-options {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .weight-options button {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 0.15rem 0.6rem;
            font-family: var(--font-family);
            font-size: 0.7rem;
            cursor: pointer;
            color: var(--text);
            transition: 0.1s;
        }
        .weight-options button:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .weight-options button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .preview-textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            resize: vertical;
            outline: none;
            transition: border 0.15s;
            min-height: 50px;
        }
        .preview-textarea:focus {
            border-color: var(--accent);
        }

        /* ── responsive ── */
        @media (max-width: 600px) {
            body {
                padding: 0.8rem 0.6rem 1.2rem;
            }
            h1 {
                font-size: 1.4rem;
            }
            .top-row .search-wrap input {
                font-size: 0.85rem;
                padding: 0.4rem 0.8rem 0.4rem 2rem;
            }
            .top-row .search-wrap .search-icon {
                left: 0.6rem;
                font-size: 0.85rem;
            }
            .top-row .toolbar button {
                font-size: 0.75rem;
                padding: 0.35rem 0.6rem;
            }
            .chips button {
                font-size: 0.75rem;
                padding: 0.2rem 0.7rem;
            }
            .font-item {
                padding: 0.6rem 0.7rem;
                min-height: 56px;
            }
            .font-item .name {
                font-size: 1rem;
            }
            .font-item .category {
                font-size: 0.65rem;
            }
            .font-item .actions button {
                font-size: 0.65rem;
                padding: 0.15rem 0.5rem;
            }
            .preview-text {
                font-size: 1.4rem;
                min-height: 60px;
            }
            .preview-header .preview-title {
                font-size: 1.1rem;
            }
            .preview-abc {
                font-size: 0.8rem;
                gap: 0.2rem 0.5rem;
            }
            .preview-abc span {
                font-size: 0.7rem;
            }
            .stats {
                font-size: 0.7rem;
                padding-top: 0.6rem;
                margin-top: 0.5rem;
            }
        }
        @media (max-width: 400px) {
            .font-item .name {
                font-size: 0.9rem;
            }
            .font-item .actions button {
                font-size: 0.6rem;
                padding: 0.1rem 0.4rem;
            }
            .chips button {
                font-size: 0.65rem;
                padding: 0.15rem 0.5rem;
            }
            .top-row .search-wrap input {
                font-size: 0.8rem;
                padding: 0.35rem 0.6rem 0.35rem 1.8rem;
            }
            .top-row .search-wrap .search-icon {
                left: 0.5rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- header -->
        <header>
            <h1>Typace</h1>
            <div class="toolbar">
                <button id="aboutBtn" class="icon-btn" aria-label="About">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4"/>
        <path d="M12 8h.01"/>
    </svg>
</button>
                <button id="darkToggle" class="icon-btn" aria-label="Toggle dark mode">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- search + chips -->
        <div class="top-row">
            <div class="search-wrap">
                <span class="search-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
    </svg>
</span>
                <input type="text" id="searchInput" placeholder="Search fonts…" aria-label="Search fonts" />
            </div>
        </div>

        <div class="chips" id="chipContainer">
            <button class="active" data-category="All">All <span class="count"></span></button>
        </div>

        <!-- font list -->
        <div class="font-list" id="fontList"></div>

        <div class="stats" id="countDisplay">0 fonts</div>
    </div>

    <!-- About Modal -->
    <div id="aboutModal" class="modal-overlay">
        <div class="modal">
            <h2>Typace</h2>
            <p>A curated font collection for your next project.</p>
            <p>Search, filter, and download fonts instantly.</p>
            <p style="font-size:0.8rem; margin-top:0.2rem;">
                Find us on the <a href="https://ace-base.indevs.in" target="_blank" rel="noopener noreferrer">web</a>.
            </p>
            <button class="close-btn" id="modalCloseBtn">Close</button>
        </div>
    </div>

    <!-- Preview -->
    <div id="previewOverlay" class="preview-overlay">
        <div class="preview-header">
            <button class="back-btn" id="previewBack">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
                Back
            </button>
            <span class="preview-title" id="previewTitle">Font</span>
            <button class="preview-download" id="previewDownload">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                Download
            </button>
        </div>
        <div class="preview-body">
            <div class="preview-text" id="previewText">
                The quick brown fox jumps over the lazy dog.
            </div>
            <div class="preview-abc" id="previewAbc">
                <span>ABCDEFGHIJKLMNOPQRSTUVWXYZ</span>
                <span>abcdefghijklmnopqrstuvwxyz</span>
                <span>0123456789</span>
                <span>!@#$%^&amp;*()</span>
            </div>

            <div class="preview-controls">
                <label>
                    <span>Size</span>
                    <input type="range" id="sizeSlider" min="12" max="96" value="32" />
                    <span class="range-value" id="sizeValue">32px</span>
                </label>
                <label>
                    <span>Weight</span>
                    <div class="weight-options" id="weightOptions">
                        <button data-weight="100">100</button>
                        <button data-weight="300">300</button>
                        <button data-weight="400" class="active">400</button>
                        <button data-weight="500">500</button>
                        <button data-weight="700">700</button>
                        <button data-weight="900">900</button>
                    </div>
                </label>
                <label>
                    <span>Line Ht</span>
                    <input type="range" id="lineHeightSlider" min="1" max="3" step="0.1" value="1.6" />
                    <span class="range-value" id="lineHeightValue">1.6</span>
                </label>
                <label>
                    <span>Letter Sp</span>
                    <input type="range" id="letterSpacingSlider" min="0" max="0.3" step="0.01" value="0" />
                    <span class="range-value" id="letterSpacingValue">0</span>
                </label>
                <textarea class="preview-textarea" id="previewInput" placeholder="Type anything…">The quick brown fox jumps over the lazy dog.</textarea>
            </div>
        </div>
    </div>

    <script>
        (() => {
            'use strict';

            // ── DOM refs ──
            const list = document.getElementById('fontList');
            const searchInput = document.getElementById('searchInput');
            const countDisplay = document.getElementById('countDisplay');
            const chipContainer = document.getElementById('chipContainer');
            const darkToggle = document.getElementById('darkToggle');
            const aboutBtn = document.getElementById('aboutBtn');
            const aboutModal = document.getElementById('aboutModal');
            const modalClose = document.getElementById('modalCloseBtn');

            // Preview
            const previewOverlay = document.getElementById('previewOverlay');
            const previewBack = document.getElementById('previewBack');
            const previewTitle = document.getElementById('previewTitle');
            const previewDownload = document.getElementById('previewDownload');
            const previewText = document.getElementById('previewText');
            const previewInput = document.getElementById('previewInput');
            const previewAbc = document.getElementById('previewAbc');
            const sizeSlider = document.getElementById('sizeSlider');
            const sizeValue = document.getElementById('sizeValue');
            const lineHeightSlider = document.getElementById('lineHeightSlider');
            const lineHeightValue = document.getElementById('lineHeightValue');
            const letterSpacingSlider = document.getElementById('letterSpacingSlider');
            const letterSpacingValue = document.getElementById('letterSpacingValue');
            const weightOptions = document.getElementById('weightOptions');

            // ── State ──
            let allFonts = [];
            let filteredFonts = [];
            let currentCategory = 'All';
            let searchQuery = '';
            let darkMode = false;
            let loadedFonts = new Set();
            let loadingFonts = new Set();
            let currentPreviewFont = null;
            let currentWeight = 400;
            let searchTimer = null;
            let observer = null;
            let categories = new Set();

            // ── localStorage ──
            function storageGet(key, fallback) {
                try { const v = localStorage.getItem('typace_' + key); return v ? JSON.parse(v) : fallback; } catch (
                _) { return fallback; }
            }

            function storageSet(key, val) {
                try { localStorage.setItem('typace_' + key, JSON.stringify(val)); } catch (_) {}
            }

            // ── Font loading ──
            async function loadFont(font) {
                const key = font.file;
                if (loadedFonts.has(key)) return true;
                if (loadingFonts.has(key)) {
                    return new Promise((resolve) => {
                        const check = () => {
                            if (loadedFonts.has(key)) resolve(true);
                            else if (!loadingFonts.has(key)) resolve(false);
                            else setTimeout(check, 50);
                        };
                        check();
                    });
                }
                loadingFonts.add(key);
                try {
                    const face = new FontFace(font.name, `url(fonts/${encodeURIComponent(font.file)})`);
                    await face.load();
                    document.fonts.add(face);
                    loadedFonts.add(key);
                    loadingFonts.delete(key);
                    return true;
                } catch (e) {
                    loadingFonts.delete(key);
                    return false;
                }
            }

            function isLoaded(font) { return loadedFonts.has(font.file); }

            // ── Scoring search ──
            function scoreMatch(text, query) {
                if (!query) return 1000;
                const t = text.toLowerCase(),
                    q = query.toLowerCase();
                if (t === q) return 100;
                if (t.startsWith(q)) return 90;
                if (t.includes(q)) return 70;
                let qi = 0;
                for (let i = 0; i < t.length && qi < q.length; i++) {
                    if (t[i] === q[qi]) qi++;
                }
                return qi === q.length ? 50 : 0;
            }

            // ── Render ──
            function render() {
                const query = searchInput.value.trim().toLowerCase();
                searchQuery = query;

                let working = [...allFonts];

                // Category filter
                if (currentCategory !== 'All') {
                    working = working.filter(f => (f.category || 'Uncategorized') === currentCategory);
                }

                // Search scoring
                if (query) {
                    const scored = working.map(f => {
                        const ns = scoreMatch(f.name, query);
                        const cs = f.category ? scoreMatch(f.category, query) * 0.5 : 0;
                        return { font: f, score: Math.max(ns, cs) };
                    }).filter(r => r.score > 0);
                    scored.sort((a, b) => b.score - a.score);
                    working = scored.map(r => r.font);
                } else {
                    // sort by name A-Z
                    working.sort((a, b) => a.name.localeCompare(b.name));
                }

                filteredFonts = working;
                updateChips();
                renderList();
                updateCount();
                setupObserver();
            }

            function renderList() {
                if (filteredFonts.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <span class="emoji">😕</span>
                            No fonts found
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (let i = 0; i < filteredFonts.length; i++) {
                    const f = filteredFonts[i];
                    const loaded = isLoaded(f);
                    html += `
                        <div class="font-item ${loaded ? '' : 'loading'}" data-index="${i}" data-file="${f.file}">
                            <div class="left">
                                <div class="name" style="${loaded ? `font-family:'${f.name}',sans-serif;` : ''}">
                                    ${f.name}
                                    ${loaded ? '' : '<span class="loading-dots">…</span>'}
                                </div>
                                ${f.category ? `<span class="category">${f.category}</span>` : ''}
                            </div>
                            <div class="actions">
                                <button class="download-btn" data-file="${f.file}">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                        <polyline points="7 10 12 15 17 10" />
                                        <line x1="12" y1="15" x2="12" y2="3" />
                                    </svg>
                                    Download
                                </button>
                            </div>
                        </div>
                    `;
                }

                list.innerHTML = html;

                // Attach events
                list.querySelectorAll('.font-item').forEach(el => {
                    const idx = parseInt(el.dataset.index);
                    const font = filteredFonts[idx];
                    if (!font) return;

                    // Click on item → preview
                    el.addEventListener('click', (e) => {
                        if (e.target.closest('.download-btn')) return;
                        openPreview(font);
                    });

                    // Download
                    const btn = el.querySelector('.download-btn');
                    if (btn) {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            downloadFile(font.file);
                        });
                    }
                });

                // Trigger lazy loading for visible cards
                if (observer) {
                    observer.disconnect();
                }
                observer = new IntersectionObserver((entries) => {
                    for (const entry of entries) {
                        if (entry.isIntersecting) {
                            const el = entry.target;
                            const idx = parseInt(el.dataset.index);
                            if (!isNaN(idx) && idx < filteredFonts.length) {
                                const font = filteredFonts[idx];
                                if (font && !isLoaded(font) && !loadingFonts.has(font.file)) {
                                    loadFont(font).then(() => {
                                        // update the card
                                        const nameEl = el.querySelector('.name');
                                        if (nameEl) {
                                            nameEl.style.fontFamily = `'${font.name}', sans-serif`;
                                            const dots = nameEl.querySelector('.loading-dots');
                                            if (dots) dots.remove();
                                        }
                                        el.classList.remove('loading');
                                    });
                                }
                            }
                            observer.unobserve(entry.target);
                        }
                    }
                }, { rootMargin: '300px' });

                // Observe all items
                list.querySelectorAll('.font-item').forEach(el => observer.observe(el));
            }

            function setupObserver() {
                if (observer) {
                    observer.disconnect();
                    observer = null;
                }
                // Re-run after render
                setTimeout(() => {
                    const items = list.querySelectorAll('.font-item');
                    if (items.length === 0) return;
                    if (!observer) {
                        observer = new IntersectionObserver((entries) => {
                            for (const entry of entries) {
                                if (entry.isIntersecting) {
                                    const el = entry.target;
                                    const idx = parseInt(el.dataset.index);
                                    if (!isNaN(idx) && idx < filteredFonts.length) {
                                        const font = filteredFonts[idx];
                                        if (font && !isLoaded(font) && !loadingFonts.has(font.file)) {
                                            loadFont(font).then(() => {
                                                const nameEl = el.querySelector('.name');
                                                if (nameEl) {
                                                    nameEl.style.fontFamily =
                                                        `'${font.name}', sans-serif`;
                                                    const dots = nameEl.querySelector('.loading-dots');
                                                    if (dots) dots.remove();
                                                }
                                                el.classList.remove('loading');
                                            });
                                        }
                                    }
                                    observer.unobserve(entry.target);
                                }
                            }
                        }, { rootMargin: '300px' });
                    }
                    items.forEach(el => observer.observe(el));
                }, 50);
            }

            function updateCount() {
                const total = filteredFonts.length;
                const q = searchQuery;
                countDisplay.textContent = `${total} font${total !== 1 ? 's' : ''}` +
                    (q ? ` · matching “${q}”` : '') +
                    (currentCategory !== 'All' ? ` · ${currentCategory}` : '');
            }

            // ── Chips ──
            function updateChips() {
                const cats = ['All', ...Array.from(categories).sort()];
                let html = '';
                for (const c of cats) {
                    const count = c === 'All' ? allFonts.length :
                        allFonts.filter(f => (f.category || 'Uncategorized') === c).length;
                    const active = c === currentCategory ? 'active' : '';
                    html += `
                        <button class="${active}" data-category="${c}">
                            ${c} <span class="count">${count}</span>
                        </button>
                    `;
                }
                chipContainer.innerHTML = html;

                chipContainer.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentCategory = btn.dataset.category;
                        render();
                    });
                });
            }

            // ── Download ──
            function downloadFile(file) {
                const a = document.createElement('a');
                a.href = `fonts/${encodeURIComponent(file)}`;
                a.download = file;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            // ── Preview ──
            async function openPreview(font) {
                currentPreviewFont = font;
                previewTitle.textContent = font.name;

                // Load if needed
                if (!isLoaded(font)) {
                    previewText.textContent = 'Loading…';
                    previewText.style.fontFamily = 'var(--font-family)';
                    await loadFont(font);
                }

                const els = [previewText, previewInput, ...previewAbc.querySelectorAll('span')];
                els.forEach(el => {
                    el.style.fontFamily = `'${font.name}', sans-serif`;
                });

                sizeSlider.value = 32;
                sizeValue.textContent = '32px';
                lineHeightSlider.value = 1.6;
                lineHeightValue.textContent = '1.6';
                letterSpacingSlider.value = 0;
                letterSpacingValue.textContent = '0';
                currentWeight = 400;
                weightOptions.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                weightOptions.querySelector('[data-weight="400"]')?.classList.add('active');
                previewInput.value = 'The quick brown fox jumps over the lazy dog.';
                updatePreview();

                previewOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closePreview() {
                previewOverlay.classList.remove('active');
                document.body.style.overflow = '';
                currentPreviewFont = null;
            }

            function updatePreview() {
                const text = previewInput.value || ' ';
                previewText.textContent = text;
                previewText.style.fontSize = sizeSlider.value + 'px';
                previewText.style.lineHeight = lineHeightSlider.value;
                previewText.style.letterSpacing = letterSpacingSlider.value + 'em';
                previewText.style.fontWeight = currentWeight;
            }

            // ── Dark mode ──
            darkMode = storageGet('dark', false);

            function applyDark(enabled) {
                document.body.classList.toggle('dark', enabled);
                darkToggle.innerHTML = enabled ?
                    `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>` :
                    `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
                storageSet('dark', enabled);
            }
            applyDark(darkMode);
            darkToggle.addEventListener('click', () => { darkMode = !darkMode;
                applyDark(darkMode); });

            // ── Modals ──
            aboutBtn.addEventListener('click', () => aboutModal.classList.add('active'));
            modalClose.addEventListener('click', () => aboutModal.classList.remove('active'));
            aboutModal.addEventListener('click', (e) => { if (e.target === aboutModal) aboutModal.classList.remove(
                    'active'); });

            // ── Preview events ──
            previewBack.addEventListener('click', closePreview);
            previewDownload.addEventListener('click', () => {
                if (currentPreviewFont) downloadFile(currentPreviewFont.file);
            });
            previewInput.addEventListener('input', updatePreview);
            sizeSlider.addEventListener('input', () => { sizeValue.textContent = sizeSlider.value + 'px';
                updatePreview(); });
            lineHeightSlider.addEventListener('input', () => { lineHeightValue.textContent = lineHeightSlider.value;
                updatePreview(); });
            letterSpacingSlider.addEventListener('input', () => { letterSpacingValue.textContent = letterSpacingSlider
                    .value;
                updatePreview(); });
            weightOptions.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    weightOptions.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentWeight = parseInt(btn.dataset.weight);
                    updatePreview();
                });
            });

            // ── Keyboard ──
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    const tag = e.target.tagName;
                    if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
                        e.preventDefault();
                        searchInput.focus();
                        searchInput.select();
                    }
                }
                if (e.key === 'Escape') {
                    if (previewOverlay.classList.contains('active')) closePreview();
                    else if (aboutModal.classList.contains('active')) aboutModal.classList.remove('active');
                }
                if (previewOverlay.classList.contains('active') && currentPreviewFont) {
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        e.preventDefault();
                        const idx = filteredFonts.findIndex(f => f.file === currentPreviewFont.file);
                        if (idx === -1) return;
                        let ni = e.key === 'ArrowLeft' ? idx - 1 : idx + 1;
                        if (ni < 0) ni = filteredFonts.length - 1;
                        if (ni >= filteredFonts.length) ni = 0;
                        if (filteredFonts[ni]) openPreview(filteredFonts[ni]);
                    }
                }
            });

            // ── Search debounce ──
            searchInput.addEventListener('input', () => {
                if (searchTimer) clearTimeout(searchTimer);
                searchTimer = setTimeout(() => { searchTimer = null;
                    render(); }, 150);
            });

            // ── Load fonts ──
            async function loadFontsData() {
                const cached = storageGet('fontsData', null);
                if (cached && Array.isArray(cached) && cached.length) {
                    allFonts = cached;
                    // Build categories
                    categories = new Set(allFonts.map(f => f.category || 'Uncategorized'));
                    render();
                    // Preload first few
                    const preload = allFonts.slice(0, 6);
                    await Promise.allSettled(preload.map(f => loadFont(f)));
                    // Re-render to show loaded fonts
                    render();
                    // Fetch fresh in background
                    fetchFresh();
                } else {
                    await fetchFresh();
                }
            }

            async function fetchFresh() {
                try {
                    const res = await fetch('fonts.json');
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length) {
                        allFonts = data;
                        categories = new Set(allFonts.map(f => f.category || 'Uncategorized'));
                        storageSet('fontsData', data);
                        render();
                        const preload = allFonts.slice(0, 6);
                        await Promise.allSettled(preload.map(f => loadFont(f)));
                        render();
                    }
                } catch (e) {
                    console.error('Failed to load fonts.json', e);
                    if (allFonts.length === 0) {
                        list.innerHTML =
                            `<div class="empty-state"><span class="emoji">❌</span>Failed to load fonts<br><span style="font-size:0.8rem;">${e.message}</span></div>`;
                    }
                }
            }

            // ── Start ──
            loadFontsData();

            // Expose for debugging
            window.__typace = {
                all: () => allFonts,
                filtered: () => filteredFonts,
                loaded: () => [...loadedFonts],
                reload: fetchFresh
            };

        })();
    </script>
</body>
</html>
